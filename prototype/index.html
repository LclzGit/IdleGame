<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daemon Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root{
    color-scheme:dark;
    --bg:#0e0c1d; --win:#17142b; --winhi:#201c3d; --line:#2e2856;
    --text:#e7e3ff; --mute:#8f89b8; --amber:#ffb454; --cyan:#5ce1e6;
    --pink:#ff3d7f; --green:#6ee7a8; --dock:#0a0916; --bar:#07060f;
    --mono:"IBM Plex Mono",ui-monospace,monospace; --pix:"Silkscreen",ui-monospace,monospace;
  }
  html,body{height:100%}
  body{background:var(--bg); color:var(--text); font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif; display:flex; flex-direction:column; overflow:hidden}

  /* área de trabalho falsa: o jogo mora só na barra de baixo */
  .desk{
    flex:1; position:relative; padding:16px;
    background:
      radial-gradient(700px 360px at 80% 20%, rgba(185,140,255,.10), transparent 70%),
      radial-gradient(500px 300px at 10% 90%, rgba(92,225,230,.07), transparent 70%),
      var(--bg);
  }
  .dicon{display:grid; justify-items:center; gap:4px; width:84px; padding:6px; background:none; border:1px solid transparent; box-shadow:none; color:var(--text); font:11px var(--mono); cursor:pointer}
  .dicon:hover{border-color:var(--line); background:rgba(255,255,255,.03)}
  .dicon .ic{width:34px; height:40px; background:var(--text); clip-path:polygon(0 0,72% 0,100% 22%,100% 100%,0 100%); position:relative}
  .dicon .ic::after{content:""; position:absolute; inset:14px 7px 8px; background:repeating-linear-gradient(#0e0c1d 0 2px, transparent 2px 5px)}
  .wm{position:absolute; right:16px; bottom:12px; margin:0; font:11px var(--mono); color:#4c4677}
  .wm b{font:400 12px var(--pix); color:#6b63a3}

  .dock{position:relative; background:var(--dock); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
  /* barra do jogo: fase | recursos | menus (só ícone; o nome aparece no hover e em telas largas) */
  .hud{display:flex; align-items:center; gap:14px; height:32px; padding-inline:8px 6px; font:11px var(--mono); white-space:nowrap; overflow:hidden}
  .hud > *{flex:none}
  .hstage{display:flex; align-items:center; gap:8px; padding-right:14px; border-right:1px solid var(--line)}
  .stg{font:400 11px var(--pix); color:var(--sec,var(--cyan)); background:none; border:0; box-shadow:none; padding:0}
  .stg:hover:not(:disabled){text-decoration:underline; border:0}
  .prog{width:64px; height:5px; border:1px solid var(--line); background:#0b0a16}
  .prog i{display:block; height:100%; width:0; background:var(--sec,var(--cyan))}
  #secTxt{color:var(--mute); width:13ch; font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis}
  .hcur{display:flex; gap:6px}
  .cur{display:flex; gap:5px; align-items:center; height:22px; padding:0 7px; background:#0b0a16; border:1px solid #1d1a36; cursor:help}
  .cur img{image-rendering:pixelated}
  .cur b{font:400 12px var(--pix); color:var(--amber); font-variant-numeric:tabular-nums; min-width:3ch; text-align:right}
  .cur.pw b{color:var(--cyan)} .cur.df b{color:#7fd6da}
  .tabs{flex:1 1 auto !important; min-width:0; display:flex; justify-content:flex-end; gap:2px; overflow:hidden}
  .tabs button{position:relative; flex:0 0 auto; white-space:nowrap; display:flex; align-items:center; gap:5px; height:26px; padding:0 7px; box-shadow:none; background:transparent; border-color:transparent; color:var(--mute)}
  .tabs button img{image-rendering:pixelated}
  .tabs button span{display:none}
  @media (min-width:1500px){ .tabs button span{display:inline} }
  .tabs button:hover{color:var(--text); border-color:var(--line)}
  .tabs button.fit-off{display:none}
  .tabs button[aria-pressed="true"]{color:var(--amber); border-color:var(--amber); background:#12102a}
  .tabs i{font-style:normal; font-size:9px; color:var(--cyan)}
  #speed{height:24px}
  @media (max-width:900px){ .hstage{padding-right:8px} .prog{display:none} .hcur .df{display:none} .tabs .opt{display:none} }
  @media (max-width:600px){ .hcur .pw{display:none} #secTxt{width:auto} .tabs .opt2{display:none} }
  .bnd{position:absolute; left:2px; top:2px; font:400 7px var(--pix); color:#1b1400; background:var(--amber); padding:0 2px; line-height:9px}
  #strip{display:block; image-rendering:pixelated; image-rendering:crisp-edges; border-top:1px solid #000}
  .taskbar{height:26px; display:flex; align-items:stretch; gap:2px; padding-inline:6px; background:var(--bar); border-top:1px solid #000; font:11px var(--mono); color:var(--mute); overflow:hidden; white-space:nowrap}
  .taskbar span{display:flex; align-items:center; padding-inline:9px}
  .start{color:var(--amber); font-size:14px}
  .task.on{color:var(--text); border-bottom:2px solid var(--amber); background:#12102a}
  .taskbar .tb{display:flex; align-items:center; gap:5px; padding:0 9px; background:none; border:0; box-shadow:none; font:11px var(--mono); color:var(--mute); cursor:pointer}
  .taskbar .tb:hover{color:var(--text); background:#12102a}
  .taskbar .tb[aria-pressed="true"]{color:var(--text); border-bottom:2px solid var(--cyan); background:#12102a}
  .taskbar .tb img{image-rendering:auto}
  #panel.nocur .pcur{display:none}
  .cfg section{padding:6px 0 8px; border-bottom:1px dashed var(--line)}
  .cfg section:last-child{border-bottom:0}
  .cfg h3{margin:0 0 4px; font:400 11px var(--pix); letter-spacing:.08em; color:var(--cyan)}
  .cfg .cfr{display:flex; align-items:center; gap:8px; margin:3px 0; font-size:11px}
  .cfg .cfr > span{min-width:130px; color:var(--mute)}
  .cfg input[type=range]{flex:1; max-width:200px; accent-color:var(--cyan)}
  .cfg .cfr b{width:28px; text-align:right; font-weight:400}
  .cfg select{background:#0b0a16; color:var(--text); border:1px solid var(--line); font:11px var(--mono); padding:2px 4px}
  .cfg textarea{width:100%; margin-top:6px; background:#0b0a16; color:var(--mute); border:1px solid var(--line); font:10px var(--mono); resize:vertical}
  .cfg .off{opacity:.55}
  .cfg .row{display:flex; flex-wrap:wrap; gap:6px}
  .clock{margin-left:auto; font-variant-numeric:tabular-nums}

  /* painel que abre acima da barra */
  .panel{position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 10px); width:min(660px, calc(100% - 24px)); max-height:calc(100vh - 190px); display:flex; flex-direction:column; z-index:5;
    background:#0f0d1e; border:1px solid #5ce1e6; box-shadow:0 0 0 1px #000, 0 0 24px rgba(92,225,230,.18), 6px 6px 0 rgba(0,0,0,.55)}
  .panel.wide{width:min(1020px, calc(100% - 24px))}
  .panel[hidden]{display:none}
  .pbar{display:flex; align-items:center; gap:8px; padding:5px 6px 5px 8px; background:linear-gradient(90deg, #0f3a40, #16122c 60%); border-bottom:1px solid #1f5a60}
  .pbar img{image-rendering:pixelated}
  .ppath{margin:0; font:12px var(--mono); color:#7fd6da; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ppath span{color:#3f8f94} .ppath b{font:400 12px var(--pix); color:var(--text); letter-spacing:.06em; text-transform:uppercase}
  .pcur{margin-left:auto; font:11px var(--mono); color:var(--mute); padding:1px 8px; background:#0b0a16; border:1px solid #1f5a60; white-space:nowrap}
  .pcur b{font:400 11px var(--pix); color:var(--amber)} .pcur i{font-style:normal; color:var(--cyan)}
  .pwin{display:flex; gap:2px}
  .pwin i{display:grid; place-items:center; width:20px; height:18px; font:11px var(--mono); font-style:normal; color:#3f8f94; border:1px solid #1f5a60}
  .pwin button{width:22px; height:18px; padding:0; box-shadow:none; background:#3a1024; border-color:#ff3d7f; color:#ffd0dc}
  .pmain{display:flex; min-height:0; flex:1}
  .pnav{display:flex; flex-direction:column; gap:2px; padding:6px 4px; background:#0a0918; border-right:1px solid #1f5a60}
  .nb{position:relative; display:grid; justify-items:center; gap:1px; width:54px; padding:5px 2px 3px; background:none; border:1px solid transparent; box-shadow:none}
  .nb img{image-rendering:pixelated}
  .nb span{font:9px var(--mono); color:var(--mute)}
  .nb:hover{background:#15122b; border-color:#1f5a60}
  .nb[aria-pressed="true"]{background:#10272b; border-color:#1f5a60}
  .nb[aria-pressed="true"]::before{content:""; position:absolute; left:-5px; top:6px; bottom:6px; width:3px; background:var(--cyan)}
  .nb[aria-pressed="true"] span{color:var(--cyan)}
  .pbody{flex:1; min-width:0; overflow:auto; padding:12px; font:12px/1.45 var(--mono);
    background:linear-gradient(rgba(92,225,230,.03) 1px, transparent 1px) 0 0/100% 3px}
  .pstatus{display:flex; flex-wrap:wrap; gap:4px 16px; padding:3px 10px; font:10px var(--mono); color:#3f8f94; background:#0a0918; border-top:1px solid #1f5a60}
  .pstatus .ok{color:var(--green)}
  /* árvore do antivírus */
  .tree2{display:grid; grid-template-columns:1fr 250px; gap:10px; min-height:0}
  .tmap{position:relative; height:min(470px, calc(100vh - 290px)); overflow:auto; cursor:grab; border:1px solid #1f5a60; user-select:none;
    background:radial-gradient(circle at 50% 50%, rgba(255,180,84,.08), transparent 45%), linear-gradient(rgba(46,40,86,.5) 1px, transparent 1px) 0 0/25px 25px, linear-gradient(90deg, rgba(46,40,86,.5) 1px, transparent 1px) 0 0/25px 25px, #09081a;
    scrollbar-width:thin}
  .tmap.dragging{cursor:grabbing}
  .tcan{position:relative}
  .tcan svg{position:absolute; inset:0; pointer-events:none; z-index:0}
  .tn:active:not(:disabled), .tn:hover{transform:translate(-50%, -50%)}
  .tn.pop{animation:tpop .35s}
  @keyframes tpop{50%{transform:translate(-50%, -50%) scale(1.3)}}
  .tn{position:absolute; z-index:1; transform:translate(-50%, -50%); display:grid; place-items:center; width:32px; height:32px; padding:0; background:#110f24; border:2px solid #2e2856; box-shadow:none}
  .tn img{image-rendering:pixelated}
  .tn small{position:absolute; bottom:-9px; font:8px var(--mono); color:var(--mute); background:#09081a; padding:0 2px}
  .tn.locked{opacity:.35}
  .tn.open{border-color:var(--bc); border-style:dashed}
  .tn.has{border-color:var(--bc); background:color-mix(in srgb, var(--bc) 18%, #110f24); box-shadow:0 0 8px color-mix(in srgb, var(--bc) 45%, transparent)}
  .tn.max small{color:var(--bc)}
  .tn.key{width:42px; height:42px; clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); border-width:0; background:color-mix(in srgb, var(--bc) 30%, #110f24)}
  .tn.key.has{background:var(--bc)}
  .tn.core{width:48px; height:48px; border-color:var(--amber); border-radius:50%; background:#2a1d08; box-shadow:0 0 18px rgba(255,180,84,.45)}
  .tn.sel{outline:2px solid #ffffff; outline-offset:2px}
  .tside > * + *{margin-top:8px}
  .tside{display:block; font-size:11px; max-height:min(470px, calc(100vh - 290px)); overflow:auto}
  .tdef b{font:400 14px var(--pix)}
  .tsum{padding:4px 0; border-top:1px dashed var(--line)}
  .tsum small{color:var(--mute)}
  @media (max-width:760px){ .tree2{grid-template-columns:1fr} .tside{max-height:none} }
  /* tela de agente: diagnóstico */
  .procs{display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; margin-bottom:8px}
  .proc{display:grid; grid-template-columns:24px 1fr; gap:2px 8px; align-items:center; padding:4px 6px; text-align:left; background:#0b0a16; border:1px solid #1f5a60; box-shadow:none}
  .proc img{image-rendering:pixelated; grid-row:1 / span 2}
  .proc b{display:block; font:600 11px var(--mono); color:var(--text)}
  .proc small{font-size:9px; color:#3f8f94}
  .proc .mini{grid-column:2; height:3px; background:#1a1733; display:block}
  .proc .mini i{display:block; height:100%; background:var(--green)}
  .proc.on{border-color:var(--cyan); background:#0e2629}
  .dx{display:grid; grid-template-columns:176px 1fr; gap:12px}
  .scan{display:grid; justify-items:center; align-content:start; gap:3px; text-align:center}
  .chamber{position:relative; width:168px; height:168px; display:grid; place-items:center; overflow:hidden;
    background:linear-gradient(rgba(92,225,230,.12) 1px, transparent 1px) 0 0/100% 8px, radial-gradient(circle, #123338, #070612 70%);
    border:1px solid #1f5a60}
  .chamber::before,.chamber::after{content:""; position:absolute; width:14px; height:14px; border:2px solid var(--cyan)}
  .chamber::before{left:3px; top:3px; border-right:0; border-bottom:0}
  .chamber::after{right:3px; bottom:3px; border-left:0; border-top:0}
  .chamber img{image-rendering:auto; position:relative}
  .beam{position:absolute; left:0; right:0; height:2px; background:rgba(92,225,230,.75); box-shadow:0 0 8px var(--cyan); animation:beam 2.6s linear infinite}
  @keyframes beam{from{top:0} to{top:100%}}
  @media (prefers-reduced-motion:reduce){ .beam{animation:none; top:50%} }
  .scan .nm{font:400 12px var(--pix)}
  .scan .rl{font-size:10px; color:var(--mute); text-transform:uppercase; letter-spacing:.05em}
  .scan .stat{font-size:9px; letter-spacing:.08em} .scan .ok{color:var(--green)} .scan .bad{color:var(--pink)}
  .socks{display:grid; gap:3px; align-content:start}
  .socks .lbl{margin:0 0 2px; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:#3f8f94}
  .sock{position:relative; display:grid; grid-template-columns:28px 78px 1fr auto; align-items:center; gap:6px; padding:3px 6px; text-align:left;
    background:#0b0a16; border:1px solid #1a1733; border-left:3px solid var(--rc, #2e2856); box-shadow:none; font-size:11px}
  .sock img{image-rendering:pixelated}
  .sock .sn{font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute)}
  .sock .si{color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sock b{font:400 10px var(--pix); color:var(--rc)}
  .sock .setd{position:absolute; left:32px; top:3px; width:5px; height:5px}
  .sock.empty{opacity:.55; border-left-style:dashed}
  .sock.empty .ph{display:grid; place-items:center; width:24px; height:24px; border:1px dashed #2e2856; font-size:8px; color:var(--mute)}
  .sock.empty .si{color:var(--mute)}
  .rd{display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; margin-top:10px; padding:8px 10px; background:#070612; border:1px solid #1f5a60}
  .rd .hp{grid-column:1 / -1; margin:0 0 4px}
  .rd .st div{display:flex; gap:6px; font-size:11px}
  .rd .st span{color:#7fd6da} .rd .st i{flex:1; border-bottom:1px dotted #1f5a60; margin-bottom:4px} .rd .st b{color:var(--text)}
  .cmds{display:grid; gap:4px; align-content:start}
  .cmds button{text-align:left; background:#0e2629; border-color:#1f5a60; font-size:11px; display:flex; justify-content:space-between; gap:6px}
  .cmds small{color:var(--mute)}
  .cmds b img{image-rendering:pixelated; vertical-align:-1px}
  .tip{position:fixed; z-index:50; width:280px; padding:8px 10px; pointer-events:none; font:11px/1.45 var(--mono); color:var(--text);
    background:#0a0918; border:1px solid var(--cyan); box-shadow:0 0 0 1px #000, 0 6px 18px rgba(0,0,0,.6)}
  .tip .th{display:flex; gap:8px; align-items:center; margin-bottom:4px}
  .tip img{image-rendering:pixelated}
  .tip .tl{padding:3px 0; border-top:1px dashed #1f2a44}
  .tip .tv{margin-top:4px; color:var(--amber)}
  .panel[hidden]{display:none}
  .pbody p{margin:0 0 8px}
  .hint{color:var(--mute)}
  button{font:11px var(--mono); color:var(--text); background:var(--winhi); border:1px solid var(--line); padding:3px 8px; cursor:pointer; box-shadow:2px 2px 0 #000}
  button:hover:not(:disabled){border-color:var(--amber)}
  button:active:not(:disabled){transform:translate(1px,1px); box-shadow:1px 1px 0 #000}
  button:disabled{opacity:.4; cursor:default}
  button b{color:var(--amber); font-weight:600}
  button:focus-visible,input:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  label{display:inline-flex; align-items:center; gap:5px; color:var(--mute); cursor:pointer}
  .opts{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; padding-top:8px; border-top:1px dashed var(--line)}
  /* esquadrão */
  .hr{display:grid; grid-template-columns:48px 1fr auto; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line)}
  .hr img{image-rendering:pixelated}
  .hn{display:flex; gap:8px; align-items:baseline}
  .hn b{font:400 12px var(--pix)}
  .hn span{color:var(--mute); font-size:10px; text-transform:uppercase; letter-spacing:.06em}
  .hp{height:4px; background:#0b0a16; border:1px solid var(--line); margin:3px 0}
  .hp i{display:block; height:100%; background:var(--green)}
  .st{color:var(--mute); font-size:11px; font-variant-numeric:tabular-nums}
  .gear{color:var(--rc); font-size:11px}
  .eqrow{display:flex; gap:3px; margin-top:4px}
  .eqs{position:relative; display:grid; place-items:center; width:30px; height:30px; padding:0; background:#0b0a16; border:1px solid var(--rc, var(--line)); box-shadow:inset 0 -2px 0 var(--rc, transparent); font:9px var(--mono); color:var(--mute)}
  .eqs img{image-rendering:pixelated}
  .eqs i{position:absolute; right:1px; bottom:0; font:400 7px var(--pix); color:var(--rc); font-style:normal}
  .eqs.empty{border-style:dashed; box-shadow:none; opacity:.6}
  .gear button{padding:0 5px; box-shadow:none; font-size:10px; margin-left:4px}
  .hb{display:grid; gap:4px}
  .hb button{text-align:left}
  .prev{display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:8px; color:var(--mute); font-size:11px}
  .prev button{padding:1px 5px; box-shadow:none; color:var(--rc)}
  .prev button[aria-pressed="true"]{border-color:currentColor; background:#0b0a16}

  /* inventário */
  .inv{display:grid; grid-template-columns:repeat(6, 52px); gap:4px; justify-content:center}
  .cell{aspect-ratio:1; max-width:100%; display:grid; place-content:center; gap:1px; padding:0; background:#0b0a16; border:1px solid var(--line); box-shadow:inset 0 -3px 0 var(--rc,transparent); color:var(--rc); text-align:center}
  .cell.empty{border-style:dashed; opacity:.5; box-shadow:none}
  .cell .ct{font:9px var(--mono); color:var(--mute)}
  .cell img{image-rendering:pixelated; justify-self:center}
  .cell b{font:400 11px var(--pix); color:var(--rc)}
  .cell{position:relative}
  .setd{position:absolute; left:3px; top:3px; width:6px; height:6px}
  .afd{position:absolute; right:3px; top:1px; font:10px var(--mono); color:#c38cff}
  .af{color:#c38cff}
  .sets{font-size:11px; margin-top:3px; color:var(--mute)}
  .sets .on{color:var(--text)} .sets .off{opacity:.6}
  .setlist{margin-top:6px; font-size:11px; color:var(--mute)}
  .rates{border-collapse:collapse; font-variant-numeric:tabular-nums}
  .rates td{padding:1px 8px 1px 0}
  .rates td:nth-child(n+2){text-align:right}
  .setlist summary{cursor:pointer; color:var(--text)}
  .cell.dim{opacity:.3}
  .inv.comp{grid-template-columns:repeat(5, 56px); margin:6px 0}
  .cinfo{font-size:11px; color:var(--mute); margin:6px 0}
  .row{display:flex; flex-wrap:wrap; gap:6px}
  .cell.sel{border-color:var(--amber); outline:1px solid var(--amber)}
  .det{margin-top:10px; padding:8px 10px; border:1px solid var(--line); background:#0b0a16; min-height:58px}
  .dh{display:flex; gap:8px; align-items:center; margin-bottom:4px}
  .dh img{image-rendering:pixelated}
  .drops{margin-top:8px; font-size:11px}
  .chip img{image-rendering:pixelated; vertical-align:middle}
  .det .row{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}

  /* invocar */
  .btabs{display:flex; gap:4px; margin-bottom:8px}
  .btabs button[aria-pressed="true"]{border-color:var(--amber); color:var(--amber); background:#0b0a16}
  .chips{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px}
  .chip{display:grid; gap:3px; padding:6px 8px; border:1px solid var(--line); border-top:3px solid var(--rc); background:#0b0a16}
  .chip b{color:var(--rc); font-weight:600}
  .chip small{color:var(--mute); font-size:10px}
  .chip div{display:flex; gap:4px}
  .pity{margin:8px 0 4px; color:var(--mute); font-size:11px}
  .res,.col{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:5px}
  .card{display:grid; justify-items:center; align-content:start; gap:2px; padding:6px 4px; background:#0b0a16; border:1px solid var(--line); text-align:center; font-size:10px; line-height:1.3}

<script>
// Aviso de erro na tela: se algo quebrar, mostra a mensagem pra copiar e oferece recomeçar o save.
(() => {
  let box = null;
  const show = (msg, where) => {
    if (!box) {
      box = document.createElement('div');
      box.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:9999;max-width:640px;margin:auto;padding:12px 14px;background:#200d16;border:1px solid #ff3d7f;color:#ffe3ea;font:12px/1.5 ui-monospace,monospace;box-shadow:0 8px 24px rgba(0,0,0,.6)';
      box.innerHTML = '<b style="color:#ff8098">O protótipo encontrou um erro.</b> Copie o texto abaixo e mande pro desenvolvimento.<pre id="errTxt" style="white-space:pre-wrap;max-height:160px;overflow:auto;background:#0b0a16;padding:6px;margin:8px 0"></pre>' +
        '<button type="button" id="errCopy">Copiar erro</button> <button type="button" id="errHide">Continuar</button> <button type="button" id="errReset">Apagar save e recomeçar</button>';
      document.body.appendChild(box);
      box.querySelector('#errCopy').onclick = () => { try { navigator.clipboard.writeText(box.querySelector('#errTxt').textContent); } catch (e) {} };
      box.querySelector('#errHide').onclick = () => { box.remove(); box = null; };
      let armed = 0;
      box.querySelector('#errReset').onclick = ev => {
        if (Date.now() - armed > 3000) { armed = Date.now(); ev.target.textContent = 'Clique de novo pra confirmar'; return; }
        try { localStorage.removeItem('daemonbar.v2'); } catch (e) {}
        location.reload();
      };
    }
    const pre = box.querySelector('#errTxt');
    if (pre.textContent.length < 4000) pre.textContent += `${msg}\n${where || ''}\nversão: ${(document.querySelector('.wm') || {}).textContent || '?'} · ${navigator.userAgent}\n\n`;
  };

const ESIZE = {bug:[40, 32], worm:[40, 24], trojan:[40, 32], boss:[40, 40]};
function shadeY(c, y0, y1, k = .35) { return (x, y) => mix(c, y < (y0 + y1) / 2 ? '#ffffff' : '#000000', Math.abs(y - (y0 + y1) / 2) / ((y1 - y0) / 2) * k); }
const ENEMY_PAINT = {
  // Bug: besouro de glitch. Carapaça magenta com fenda, olhos brancos, 6 patas animadas e antenas faiscando.
  bug(P, f) {
    const A = '#ff3d7f', A2 = '#a81a4f', D = '#4a0a24';
    for (let i = 0; i < 3; i++) { const lx = 10 + i * 9, o = (i + f) % 2 ? 2 : -1; P.line(lx, 22, lx - 4 + o, 30, D, 2); P.line(lx + 20 - i * 2, 22, lx + 24 - i * 2 - o, 30, D, 2); }
    P.ell(20, 18, 16, 11, shadeY(A2, 7, 29, .45));

    P.line(20, 8, 20, 25, D, 1);
    for (const [x, y] of [[12, 14], [28, 14], [15, 20], [25, 20]]) P.ell(x, y, 2, 1, mix(A, '#ffffff', .35));
    P.ell(31, 10, 6, 5, shadeY('#2a0a18', 5, 15, .2));

    P.set(11, 11, '#ffffff'); P.set(12, 10, '#ffffff');
  },
  // Worm: verme de dados segmentado, verde neon, anéis sombreados e boca com mandíbulas.
  worm(P, f) {
    const G = '#a6e22e', G2 = '#4f7a10', D = '#1f3a05';
    for (let i = 0; i < 6; i++) {
      const x = 4 + i * 5.5, y = 14 + Math.round(Math.sin(i * 1.1 + f * Math.PI) * 3), r = 4 + (i > 3 ? 1 : 0);
      P.ell(x, y, r, r, shadeY(i % 2 ? G2 : G, y - r, y + r, .5)); P.line(x - 1, y - r + 1, x + 1, y - r + 1, mix(G, '#ffffff', .5));
    }
    P.ell(34, 13 + (f ? 1 : -1), 6, 6, shadeY(G, 7, 19, .45));
    P.poly([[38, 11], [40, 8], [39, 13]], D); P.poly([[38, 16], [40, 19], [39, 14]], D);
    P.ell(34, 11, 2, 2, '#ffffff'); P.set(35, 11, '#0a1a00');
    for (let i = 0; i < 4; i++) P.set(2 + i * 3, 22 - (i % 2) * 2, i % 2 ? '#d6ff9a' : '#6a9a20');
  },
  // Trojan: cavalo de Troia feito de placa de circuito, com uma janela no peito escondendo um olho vermelho.
  trojan(P, f) {

    for (const [lx, o] of [[8, f], [14, -f], [26, -f], [32, f]]) { P.rect(lx, 22, 3, 8, W2); P.rect(lx - 1 + o, 29, 5, 2, D); }
    P.poly([[5, 12], [34, 12], [34, 24], [5, 24]], shadeY(W_, 12, 24, .4));
    P.poly([[26, 12], [30, 2], [38, 4], [38, 12], [32, 14]], shadeY(W_, 2, 14, .35));
    P.poly([[30, 2], [33, 0], [34, 3]], W2); P.rect(35, 7, 2, 2, '#fff2c0');
    P.poly([[5, 12], [2, 18], [5, 20]], W2);
    for (let x = 7; x < 33; x += 6) { P.line(x, 14, x, 22, W2); P.set(x, 14, '#ffd98a'); }
    P.line(7, 18, 32, 18, W2);
    P.rect(15, 15, 9, 6, D); P.ell(19, 18, 2, 2, R); P.set(19, 17, '#ffc0c8');
    P.rect(22, 11, 2, 2, '#ffd98a');
  },
  // Ransomware: monstro-cadeado. Corpo escuro, argola do cadeado como chifres, fechadura brilhando como boca, correntes.
  boss(P, f) {

    for (let y = 1; y < 16; y++) for (let x = 8; x < 33; x++) { const q = (x - 20) ** 2 / 144 + (y - 14) ** 2 / 169; if (q <= 1 && q > .45) P.set(x, y, (x + y) % 5 ? '#9aa0b5' : '#dfe4ee'); }

// ---------- cenários por setor ----------
// Cada setor tem duas camadas em paralaxe (longe e perto) e um chão próprio, pintadas uma vez em resolução dobrada.
const BG_W = 480;   // largura lógica do bloco que se repete

    near(g, T) { const r = rnd(2); for (let i = 0; i < 9; i++) { const x = r() * BG_W, h = 6 + r() * 10;

      for (let i = 0; i < 3; i++) { const x = 60 + i * 160 + r() * 40; px(g, x, 30, 12, 16, rgba(T, .16)); px(g, x - 1, 28, 14, 2, rgba(T, .28)); for (let k = 2; k < 12; k += 3) px(g, x + k, 32, .5, 12, rgba(T, .28)); } },
  },
  { // CACHE L2: blocos de memória em colunas, com linhas de cache acendendo
    far(g, T) { for (let x = 0; x < BG_W; x += 12) for (let y = 3; y < 36; y += 5) px(g, x, y, 10, 3.5, rgba(T, (x * 7 + y * 3) % 17 < 3 ? .22 : .07)); },

  },
  { // KERNEL: núcleo com anéis de energia e canos
    far(g, T) { for (let c = 0; c < 2; c++) { const cx = 120 + c * 240; for (let r = 30; r > 6; r -= 6) { g.strokeStyle = rgba(T, .06 + (30 - r) * .006); g.lineWidth = 1; g.beginPath(); g.arc(cx, 24, r, 0, Math.PI * 2); g.stroke(); } px(g, cx - 3, 21, 6, 6, rgba(T, .35)); px(g, cx - 1, 23, 2, 2, rgba('#ffffff', .6)); } },

    near(g, T) { const r = rnd(8); for (let i = 0; i < 18; i++) { const x = r() * BG_W, y = 6 + r() * 34; px(g, x, y, 3 + r() * 10, 1 + r() * 2, rgba(r() < .5 ? T : '#5ce1e6', .12 + r() * .15)); }
      for (let i = 0; i < 6; i++) { const x = r() * BG_W, y = 14 + r() * 22; px(g, x, y, 1.5, 1, rgba('#ff3a3a', .8)); px(g, x + 4, y, 1.5, 1, rgba('#ff3a3a', .8)); } },
  },

const sceneCache = {};
function sceneOf(idx, tint, panic) {
  const k = idx + (panic ? 'p' : '');
  if (sceneCache[k]) return sceneCache[k];
  const S_ = SCENES[idx % SCENES.length];
  return sceneCache[k] = {far:bgCanvas(g => S_.far(g, panic ? '#ff5a2a' : tint)), near:bgCanvas(g => S_.near(g, panic ? '#ff5a2a' : tint))};
}

// Tudo sintetizado com Web Audio: nenhum arquivo de áudio. No Godot isso vira AudioStreamPlayer com os buses Música e Efeitos.
const SND = (() => {
  let ac = null, master, sfxG, musG, nextT = 0, step = 0;
  const last = {};
  function vol() {
    if (!ac) return;
    master.gain.value = CFG.mute ? 0 : 1;
    sfxG.gain.value = (CFG.sfx / 100) ** 2 * .6;
    musG.gain.value = (CFG.mus / 100) ** 2 * .4;
  }
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    ac = new A();
    master = ac.createGain(); master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.connect(master);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; lp.connect(master);
    musG = ac.createGain(); musG.connect(lp);
    vol();
    nextT = ac.currentTime + .1;
    setInterval(music, 200);
  }
  function tone(f, dur, type, g, at, slide, out) {
    const o = ac.createOscillator(), e = ac.createGain(), t0 = ac.currentTime + (at || 0);
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(g, t0 + .005); e.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(e); e.connect(out || sfxG); o.start(t0); o.stop(t0 + dur + .02);
  }
  function tone2(f, dur, type, g, t0, out) {   // versão com horário absoluto, pra música
    const o = ac.createOscillator(), e = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(g, t0 + .01); e.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(e); e.connect(out); o.start(t0); o.stop(t0 + dur + .02);
  }
  let nbuf = null;
  function noise(dur, g, at, hp, out, t0) {
    if (!nbuf) { nbuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), e = ac.createGain(), t = t0 || ac.currentTime + (at || 0);
    s.buffer = nbuf; f.type = 'highpass'; f.frequency.value = hp || 1000;
    e.gain.setValueAtTime(g, t); e.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(e); e.connect(out || sfxG); s.start(t); s.stop(t + dur + .02);
  }
  const N = s => 440 * 2 ** ((s - 9) / 12);   // semitons a partir do dó central
  const FX = {
    shot: () => tone(1400, .035, 'square', .025, 0, 700),
    kill: () => { noise(.05, .06, 0, 2500); tone(420, .07, 'square', .035, 0, 150); },
    gold: () => [0, 7].forEach((s, i) => tone(N(24 + s), .09, 'square', .05, i * .05)),
    drop: t => [0, 4, 7, 12, 16].slice(0, 2 + Math.min(3, t || 0)).forEach((s, i) => tone(N(12 + s), .14, 'triangle', .09, i * .055)),
    boss: () => { tone(98, .7, 'sawtooth', .07, 0, 70); tone(104, .7, 'sawtooth', .06, 0, 74); noise(.3, .05, 0, 300); },
    clear: () => [0, 4, 7, 12].forEach((s, i) => tone(N(7 + s), .16, 'square', .045, i * .075)),
    down: () => { tone(330, .4, 'triangle', .1, 0, 90); noise(.2, .04, 0, 600); },
    block: () => tone(700, .05, 'square', .035, 0, 900),
    ui: () => tone(1100, .025, 'square', .02),
  };
  function play(k, a) {
    if (!ac || CFG.mute || !CFG.sfx || !FX[k]) return;
    const now = performance.now(), gap = {shot:90, kill:70, ui:30, block:120, gold:120}[k] || 0;
    if (gap && now - (last[k] || 0) < gap) return;
    last[k] = now; FX[k](a);
  }
  // trilha: lá menor, i–VI–III–VII, 96 bpm em colcheias, calma pra tocar horas no fundo
  const CH = [[-3, 0, 4], [-7, -3, 0], [0, 4, 7], [-2, 2, 5]], BASS = [0, 3, 6, 10, 12];
  function music() {
    if (!ac || CFG.mute || !CFG.mus) { if (ac) nextT = ac.currentTime + .1; return; }
    const beat = 60 / 96 / 2;
    if (nextT < ac.currentTime) nextT = ac.currentTime + .05;
    while (nextT < ac.currentTime + 1.2) {
      const bar = Math.floor(step / 16) % 4, s = step % 16, ch = CH[bar];
      if (BASS.includes(s)) tone2(N(ch[0] - 12), beat * (s === 12 ? 3.5 : 2.5), 'triangle', .22, nextT, musG);
      const arp = [0, 1, 2, 1, 2, 0, 1, 2][s % 8] + (s >= 8 && step % 64 >= 32 ? 3 : 0);
      const n = ch[arp % 3] + 12 * (arp >= 3 ? 1 : 0);
      if (s % 2 === 0 || Math.random() < .35) tone2(N(n + 12), beat * 1.6, 'square', .035, nextT, musG);
      if (s % 4 === 2) noise(.04, .025, 0, 6000, musG, nextT);
      if (s === 0 && bar % 2 === 0) tone2(N(ch[2] + 24), beat * 6, 'sine', .04, nextT, musG);
      nextT += beat; step++;
    }
  }

  addEventListener('pointerdown', init);
  addEventListener('keydown', init);
  return {play, vol};
})();

      P.ell(8, 5, 3, 2, d); P.ell(8, 4, 3, 2, c); P.set(7, 3, W); break;
    case 'drop': P.rect(2, 6, 12, 8, '#7a5a40'); P.rect(2, 3, 12, 4, '#5a3e2c'); P.line(2, 3, 13, 3, '#9a7a58');
      P.rect(2, 6, 12, 1, AU); P.rect(7, 5, 2, 4, AU); P.set(7, 6, c); P.set(8, 6, W); P.line(3, 13, 12, 13, '#4a3020'); break;
    case 'chip': [[5, 5], [11, 5], [5, 11], [11, 11]].forEach(([x, y]) => P.ell(x, y, 3, 3, c)); P.ell(8, 8, 2, 2, d);
      P.set(4, 4, l); P.set(10, 4, l); P.line(9, 11, 13, 15, '#3e7a4a'); break;
    case 'wdrop': P.rect(1, 6, 11, 3, S1); P.line(1, 6, 11, 6, S2); P.rect(11, 7, 3, 1, S2); P.rect(3, 9, 3, 5, '#5a3e2c'); P.rect(7, 9, 2, 2, S1);
      P.line(3, 2, 3, 4, c); P.line(2, 3, 4, 3, c); P.set(14, 2, W); break;
    case 'def': P.rect(3, 1, 10, 14, '#1f5a60'); P.rect(3, 1, 10, 1, '#2f8a90');
      for (let y = 4; y < 14; y += 3) { P.line(5, y, 11, y, c); P.set(5, y, W); } P.poly([[10, 1], [13, 1], [13, 4]], '#0b0a16'); break;
    case 'spd': P.poly([[10, 0], [3, 9], [7, 9], [5, 15], [13, 6], [9, 6], [12, 0]], c); P.line(10, 1, 6, 8, W); P.line(0, 5, 3, 5, d); P.line(0, 10, 2, 10, d); break;
    case 'inv': P.rect(3, 4, 10, 11, '#5a3e2c'); P.rect(3, 4, 10, 2, '#7a5a40'); P.poly([[5, 4], [6, 1], [10, 1], [11, 4]], '#4a3020');
      P.rect(5, 8, 6, 4, '#4a3020'); P.rect(7, 9, 2, 2, c); P.set(7, 9, W); break;
    case 'off': P.ell(7, 8, 6, 6, c); P.ell(10, 6, 5, 5, '#0b0a16'); P.set(4, 7, l);
      P.line(11, 10, 14, 10, W); P.line(14, 10, 11, 13, W); P.line(11, 13, 14, 13, W); break;
    case 'core': {
      const hex = n => Array.from({length: 6}, (_, i) => [12 + Math.cos(i * Math.PI / 3 - Math.PI / 2) * n, 12 + Math.sin(i * Math.PI / 3 - Math.PI / 2) * n]);
      P.poly(hex(11), d); P.poly(hex(9), c); P.poly(hex(6), l); P.poly(hex(3), W);
      P.line(12, 1, 12, 4, W); P.set(6, 8, W);

    }
  }
  P.rim('#000000', .25, 1, 1);
  P.outline('#05040b');
  return TICON2[k] = P.canvas(false).toDataURL();
}
// nós-chave: um desenho por nome, cabendo dentro do losango do nó
function drawKeyIcon(P, name) {
  const W = '#ffffff', S1 = '#7a82a3', S2 = '#aab2cc', D = '#3a3f5c', AU = '#d6a24a';
  const ring = (cx, cy, r, c) => { for (let a = 0; a < 6.3; a += .08) P.set(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), c); };
  switch (name) {
    case 'Varredura total': {   // onda de choque em anéis
      ring(12, 12, 9, '#ff8a3a'); ring(12, 12, 6, '#ffb454'); P.ell(12, 12, 3, 3, '#ffe0b0'); P.ell(12, 12, 1, 1, W);
      for (let a = 0; a < 8; a++) { const an = a * Math.PI / 4 + .4; P.set(Math.round(12 + Math.cos(an) * 11), Math.round(12 + Math.sin(an) * 11), '#ff8a3a'); }
      break; }
    case 'Caçador de rootkits':   // mira sobre o crânio
      P.ell(12, 12, 6, 6, '#dfe4ee'); P.rect(9, 16, 7, 3, '#dfe4ee'); P.rect(9, 10, 2, 3, '#0b0a16'); P.rect(14, 10, 2, 3, '#0b0a16');
      ring(12, 12, 9, '#ff3d7f'); P.line(12, 1, 12, 5, '#ff3d7f'); P.line(12, 19, 12, 23, '#ff3d7f'); P.line(1, 12, 5, 12, '#ff3d7f'); P.line(19, 12, 23, 12, '#ff3d7f');
      break;
    case 'Execução em tempo real':   // lixeira com X vermelho
      P.rect(7, 8, 10, 12, S1); P.rect(6, 6, 12, 2, S2); P.rect(10, 4, 4, 2, S2);
      for (let x = 9; x < 16; x += 3) P.line(x, 10, x, 18, D);
      P.line(4, 4, 20, 20, '#ff3d7f', 2); P.line(20, 4, 4, 20, '#ff3d7f', 2);
      break;
    case 'Banco de assinaturas':   // banco de dados em cilindros
      [16, 11, 6].forEach((y, i) => { P.ell(12, y + 2, 7, 2, '#1f5a60'); P.rect(5, y, 15, 3, '#1f5a60'); P.ell(12, y, 7, 2, '#2f8a90'); P.set(16, y + 2, i ? '#5ce1e6' : W); });
      P.ell(12, 4, 7, 2, '#5ce1e6'); P.set(9, 4, W);
      break;
    case 'Honeypot':   // pote de mel com abelha-vírus
      P.ell(12, 14, 7, 7, '#d6a24a'); P.rect(7, 5, 10, 3, '#8a6a30'); P.rect(6, 7, 12, 2, '#b8741a');
      P.ell(10, 12, 2, 3, '#f0d08a'); P.poly([[9, 16], [11, 16], [10, 19]], '#ffb454');
      P.ell(19, 5, 2, 2, '#ff3d7f'); P.set(19, 5, '#0b0a16'); P.line(17, 3, 18, 4, W); P.line(21, 3, 20, 4, W);
      break;
    case 'Mineração profunda':   // picareta sobre moeda
      P.ell(14, 15, 6, 6, '#b8741a'); P.ell(14, 15, 5, 5, '#ffb454'); P.rect(13, 12, 2, 6, '#b8741a');
      P.line(4, 20, 14, 6, '#7a5a40', 2); P.poly([[9, 4], [15, 5], [20, 9], [15, 7]], S2); P.line(15, 5, 20, 9, W);
      break;
    case 'Firewall de borda':   // muro de tijolos em chamas
      P.rect(3, 12, 18, 9, '#8a3a2a');
      for (let y = 12; y < 21; y += 3) { P.line(3, y, 20, y, '#4a1a12'); for (let x = 3 + ((y / 3) % 2) * 3; x < 21; x += 6) P.line(x, y, x, y + 2, '#4a1a12'); }
      P.poly([[5, 12], [7, 6], [9, 9], [12, 2], [15, 8], [17, 5], [19, 12]], '#ff8a3a'); P.poly([[8, 12], [10, 8], [12, 5], [14, 9], [16, 12]], '#ffe066');
      break;
    case 'Imunidade':   // bolha protetora com vírus ricocheteando
      ring(12, 12, 9, '#5ca8ff'); ring(12, 12, 8, '#9ccaff'); P.ell(12, 12, 4, 5, '#dfe4ee'); P.ell(12, 9, 2, 2, '#dfe4ee'); P.set(9, 6, W);
      P.ell(20, 4, 2, 2, '#ff3d7f'); P.set(20, 4, '#0b0a16'); P.line(17, 7, 19, 5, '#ff8098');
      break;
    case 'Vacinação em massa':   // três seringas em leque saindo de um suporte
      [[-1, '#5ce1e6'], [0, '#6ee7a8'], [1, '#5ce1e6']].forEach(([k, c]) => {
        const an = -Math.PI / 2 + k * .55, pt = r => [12 + Math.cos(an) * r, 21 + Math.sin(an) * r];
        const [x1, y1] = pt(3), [x2, y2] = pt(14), [xm, ym] = pt(9), [xn, yn] = pt(18);
        P.line(x1, y1, x2, y2, '#dfe4ee', 3); P.line(x1, y1, xm, ym, c, 2); P.line(x2, y2, xn, yn, S2); P.set(Math.round(xn), Math.round(yn), W);
      });
      P.rect(7, 19, 11, 4, S1); P.line(7, 19, 17, 19, S2);
      break;
    case 'Serviço persistente':   // lua e engrenagem: roda enquanto você dorme
      P.ell(9, 10, 7, 7, '#c9c3f0'); P.ell(12, 7, 6, 6, '#0b0a16'); P.set(5, 10, W);
      P.ell(17, 17, 4, 4, S1); for (let a = 0; a < 8; a++) { const an = a * Math.PI / 4; P.set(Math.round(17 + Math.cos(an) * 5), Math.round(17 + Math.sin(an) * 5), S1); }
      P.ell(17, 17, 1, 1, '#0b0a16');
      break;
    case 'Particionamento':   // disco dividido em fatias
      P.ell(12, 12, 9, 9, '#3a2f5c'); P.poly([[12, 12], [12, 3], [18, 5], [21, 12]], '#c38cff'); P.poly([[12, 12], [21, 12], [17, 20]], '#9a6ae0');
      P.ell(12, 12, 2, 2, '#0b0a16'); P.set(15, 6, W);
      break;
    case 'Overclock extremo':   // processador com raio
      for (let i = 6; i < 19; i += 3) { P.rect(i, 2, 1, 3, S2); P.rect(i, 19, 1, 3, S2); P.rect(2, i, 3, 1, S2); P.rect(19, i, 3, 1, S2); }
      P.rect(5, 5, 14, 14, D); P.rect(6, 6, 12, 12, '#2a2436');
      P.poly([[14, 6], [8, 13], [11, 13], [9, 18], [16, 10], [13, 10], [15, 6]], '#ffe066'); P.set(13, 8, W);
      break;
    default: P.ell(12, 12, 8, 8, AU); P.ell(12, 12, 5, 5, W);
  }
}

// Campanha no modelo do Task Bar Hero: 3 atos × 10 fases × 4 dificuldades = 120 fases.
// Depois vem o Kernel Panic, sem fim. O índice `s` é global (0…119 campanha, 120+ Kernel Panic)
// e também é o nível dos inimigos e dos itens que caem.
const PER = 5, PER_ACT = 10, PER_DIFF = 30, CAMPAIGN = 120;
const DIFFS = [{n:'Normal', c:'#6ee7a8'}, {n:'Avançado', c:'#5ca8ff'}, {n:'Crítico', c:'#ffb454'}, {n:'Zero-Day', c:'#ff3d7f'}, {n:'Kernel Panic', c:'#ff5a2a'}];
const ACTS = ['Sistema de arquivos', 'Memória e kernel', 'Rede'];
const stagePos = s => s >= CAMPAIGN
  ? {d:4, a:Math.floor((s - CAMPAIGN) / PER_ACT) % 3, st:(s - CAMPAIGN) % PER_ACT, n:s - CAMPAIGN + 1}
  : {d:Math.floor(s / PER_DIFF), a:Math.floor(s % PER_DIFF / PER_ACT), st:s % PER_ACT};
const stageSec = s => {
  const p = stagePos(s), i = p.a * 2 + (p.st < PER ? 0 : 1), b = SECTORS[i];
  return {name:b.name, tint:b.tint, idx:i, d:p.d};
};
const stageLabel = s => { const p = stagePos(s); return p.d === 4 ? `Kernel Panic ${p.n}` : `${DIFFS[p.d].n} ${p.a + 1}-${p.st + 1}`; };
const sec = () => stageSec(S.stage);
const recPow = s => 260 * 1.1 ** s;

  if (st.armored && (d > 0 || si >= 2)) return d >= 2 ? ['trojan', 'rootkit', 'rootkit', 'cryptominer'] : ['trojan', 'rootkit'];
  const P = d === 0 && si === 0 ? ['bug'] : d === 0 && si === 1 ? ['bug', 'worm'] : ['bug', 'worm', 'trojan'];
  if (d >= 1) P.push('spyware');
  if (d >= 2) P.push('adware');
  if (d >= 3) P.push('keylogger');
  if (d >= 4) P.push('cryptominer');
  return P;
}

function update(dt) {
  t += dt; stT += dt;
  if (stT > (raid ? RAID_TIME : STAGE_TIME)) { if (raid) raidEnd(false, 'time'); else rollback('time'); return; }
  const alive = heroes.filter(h => !h.dead);
  if (!alive.length) { if (raid) raidEnd(false); else rollback(); return; }
  // Os vírus param sempre na linha do tanque (o agente mais à frente), mesmo se ele cair: ninguém passa por cima
  // de um agente caído. Quem cai fica fora até a próxima fase (ainda não existe suporte que revive).
  const front = alive.reduce((a, h) => h.def.x > a.def.x ? h : a);
  const line = heroes.reduce((a, h) => h.def.x > a.def.x ? h : a), stopX = line.def.x + line.def.w + 2;

  let slot = stopX;
  for (const e of enemies) {
    if (e.x > slot) e.x = Math.max(slot, e.x - 32 * dt);
    e.atStop = e.x <= slot + .01;
    slot = e.x + e.w + 3;
    e.flash = Math.max(0, e.flash - dt); e.fcd = (e.fcd || 0) - dt; e.lunge = Math.max(0, e.lunge - dt * 6);
  }
  const engaged = enemies.length > 0 && enemies[0].atStop;

  for (const h of heroes) {
    h.flash = Math.max(0, h.flash - dt); h.lunge = Math.max(0, h.lunge - dt * 6);
    if (h.dead) continue;
    if (!engaged) h.hp = Math.min(maxHp(h), h.hp + maxHp(h) * .06 * dt);
    else h.hp = Math.min(maxHp(h), h.hp + maxHp(h) * ((h.def.id === 'fw' ? pT().regen || 0 : 0) + tv('regen')) * dt);
    h.t -= dt;
    if (h.t > 0) continue;
    if (h.def.id === 'pt') {
      const hurt = alive.filter(a => !a.dead && a.hp < maxHp(a) * .8).sort((a, b) => a.hp / maxHp(a) - b.hp / maxHp(b))[0];
      if (hurt) {
        const amt = atk(h) * 4;
        hurt.hp = Math.min(maxHp(hurt), hurt.hp + amt);
        burst(hurt.def.x + 15, GROUND - 16, '#6ee7a8', 6);
        float(hurt.def.x + 15, GROUND - 42, '+' + fmtN(amt), '#6ee7a8');
        h.t = cdOf(h); h.lunge = 1;
        continue;
      }
    }
    const e = enemies[0];
    if (!e || e.x > W - 6) continue;
    if (e.x - (h.def.x + h.def.w) > h.def.range) continue;
    h.t = Math.random() < wear(h.def.id, 'dbl') ? cdOf(h) * .12 : cdOf(h); h.lunge = 1;   // GEMINIOS: ataque duplo
    if (h.def.id === 'fw') { deal(e, atk(h)); burst(e.x, GROUND - 5, '#9fd0ff', 4); }
    else if (h.def.id === 'sc') {
      const G = pG(), sh = equipped('sc').shot || {};
      const crit = Math.random() < (G.crit || 0) + tv('crit') + glob('crit'), d = atk(h) * (crit ? G.critX || 2 : 1);
      const base = {y: GROUND - (sh.y || 16), c: sh.c || heroSpr('sc').glow, style: sh.style, pierce: G.pierce || 0, splash: G.splash || 0, dps: true};
      const obs = G.obs ? ++obsCount % G.obs === 0 : false;
      shots.push({...base, x: h.def.x + (sh.x || 27), dmg: d, crit, obs}); SND.play('shot');
      for (let m = 1; m <= (G.multishot || 0); m++) shots.push({...base, x: h.def.x + 27 - m * 8, y: base.y + (m % 2 ? -3 : 3), dmg: d * .5});
    }
    else shots.push({x: h.def.x + 25, y: GROUND - 28, dmg: atk(h), c: '#6ee7a8'});
  }

  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i], e = enemies[0];
    if (!e) { shots.splice(i, 1); continue; }
    s.x += (s.style === 'laser' ? 520 : 170) * dt;
    if (s.x >= e.x) {
      shots.splice(i, 1);
      if (s.crit) float(e.x + e.w / 2, GROUND - e.h - 20, 'CRIT', '#ffb454');
      const behind = s.pierce ? enemies.slice(1, s.pierce >= 1 ? undefined : 2) : [];
      const others = enemies.filter(o => o !== e);
      deal(e, s.dmg, false, s.dps);
      behind.forEach(o => { if (enemies.includes(o)) deal(o, s.dmg * (s.pierce >= 1 ? .7 : s.pierce), true, s.dps); });
      if (s.splash) {
        burst(s.x, GROUND - 8, '#ffb454', 10);
        others.forEach(o => { if (enemies.includes(o)) deal(o, s.dmg * s.splash, true, s.dps); });
      }
      if (s.dps && tv('splash') && others.length) others.forEach(o => { if (enemies.includes(o)) deal(o, s.dmg * tv('splash'), true, true); });
      if (s.dps && dpsSub() === 'area' && others.length) others.forEach(o => { if (enemies.includes(o)) deal(o, s.dmg * .3, true, true); });
      if (s.obs) {
        showBanner('ATAQUE ORBITAL', '#ff3a3a');
        enemies.slice().forEach(o => {
          for (let k = 0; k < 6; k++) parts.push({x: o.x + Math.random() * o.w, y: 0, vx: 0, vy: 140 + Math.random() * 60, life: .5, c: k % 2 ? '#ff3a3a' : '#ffb454'});
          if (enemies.includes(o)) deal(o, s.dmg * 3, true, true);
        });
      }
    }
  }

  const e = enemies[0];
  if (e && e.atStop) {
    e.t -= dt;
    if (e.t <= 0) {
      e.t = e.cd; e.lunge = 1;
      const dodged = tv('dodge') && Math.random() < tv('dodge');
      if (dodged) { float(front.def.x + 15, GROUND - 40, 'BLOQUEADO', '#5ca8ff'); SND.play('block'); }
      const isTank = front.def.id === 'fw', dmg = e.atk * (1 - KC_RED * kcLv(e.tn)) * (isTank ? 1 - (pT().dmgRed || 0) : 1) * (1 - tv('red')) * (1 - gearStat(front.def.id, 'red') / 100) * (1 - wear(front.def.id, 'red'));
      if (!dodged) { front.hp -= dmg; front.flash = .1; }
      burst(front.def.x + front.def.w - 2, GROUND - 16, '#ff3d7f', 3);
      if (front !== line) espits.push({x:e.x, tx:front.def.x + front.def.w - 2, y:GROUND - e.h * .6, t:0});   // tanque caído: o vírus cospe à distância
      if (front.hp <= 0) { front.dead = true; front.hp = 0; SND.play('down'); say(`${front.def.name} caiu. Volta na próxima fase.`); }
      if (isTank && pT().reflect) hit(e, dmg * pT().reflect);
    }
  }

  spawnT -= dt;
  if (!bossUp) {
    const st = ST();
    if (spawned < st.count) {
      if (spawnT <= 0 && enemies.length < st.max) { spawn(false); spawned++; spawnT = st.gap[0] + Math.random() * (st.gap[1] - st.gap[0]); }
    } else if (!enemies.length) {
      spawn(true); bossUp = true; SND.play('boss'); const bt = SEC_BOSS[sec().idx % SEC_BOSS.length]; showBanner(`!! ${BOSS_N[bt]} !!`, VCOL[bt]);
    }
  }

  for (const h of heroes) {
    const vt = visTier(h.def.id);
    if (h.dead || vt < 3 || CFG.fx === 'low' || Math.random() > dt * (vt === 4 ? 14 : 7)) continue;
    parts.push({x: h.def.x + Math.random() * h.def.w, y: GROUND - Math.random() * 28, vx: 0, vy: -10 - Math.random() * 8, life: .7, c: RAR[vt].c, up: true});
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.up) { p.vy += 120 * dt; if (p.y > GROUND) { p.y = GROUND; p.vy *= -.3; p.vx *= .6; } }
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.life -= dt; f.y -= 14 * dt; if (f.life <= 0) floats.splice(i, 1); }
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  metaTick(dt);

  autoT -= dt;
  if (S.autoUp && autoT <= 0) {
    autoT = .5;
    const opts = [];
    for (const [k] of SLOTS) for (const u of ['a', 'h']) opts.push([k, u, upCost(slotAid(k), u)]);
    const best = opts.sort((a, b) => a[2] - b[2])[0];
    if (best && buyUp(best[0], best[1]) && openP === 'agent') livePanel();
  }
}

const rgbaCache = {};
function rgba(hex, a) {
  const k = hex + a;
  if (!rgbaCache[k]) {
    const n = parseInt(hex.slice(1), 16);

    if (s.style === 'laser') {
      ctx.fillStyle = rgba(s.c, .35); ctx.fillRect(x - 18, s.y - 1, 20, 3);
      ctx.fillStyle = s.c; ctx.fillRect(x - 18, s.y, 20, 1);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 6, s.y, 8, 1);
    } else if (s.style === 'shell') {
      ctx.fillStyle = rgba(s.c, .4); ctx.fillRect(x - 6, s.y, 6, 1);
      ctx.fillStyle = '#2a2a22'; ctx.fillRect(x, s.y - 1, 3, 3);
      ctx.fillStyle = s.c; ctx.fillRect(x + 2, s.y, 1, 1);
    } else if (s.style === 'arrow') {
      ctx.fillStyle = '#c9c3b0'; ctx.fillRect(x - 7, s.y, 7, 1);
      ctx.fillStyle = s.c; ctx.fillRect(x, s.y - 1, 1, 3); ctx.fillRect(x + 1, s.y, 1, 1);
      ctx.fillRect(x - 8, s.y - 1, 1, 1); ctx.fillRect(x - 8, s.y + 1, 1, 1);
    } else {
      ctx.fillStyle = rgba(s.c, .35); ctx.fillRect(x - 5, s.y, 5, 1);
      ctx.fillStyle = s.c; ctx.fillRect(x, s.y, 3, 1);
    }
  }
  for (const p of parts) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); text(f.txt, f.x, f.y, f.c, true); }
  ctx.globalAlpha = 1;
  for (let i = espits.length - 1; i >= 0; i--) {   // cuspe de vírus (visual)
    const q = espits[i]; q.t += .06; if (q.t >= 1) { espits.splice(i, 1); continue; }
    const x = q.x + (q.tx - q.x) * q.t, y = q.y - Math.sin(q.t * Math.PI) * 8;
    ctx.fillStyle = 'rgba(255,61,127,.35)'; ctx.fillRect(x - 1.5, y - 1.5, 3, 3); ctx.fillStyle = '#ff3d7f'; ctx.fillRect(x - .5, y - .5, 1.5, 1.5);
  }
  if (gold) {
    const gx = Math.round(gold.x), gy = Math.round(gold.y + Math.sin(t * 6) * 2);
    ctx.globalAlpha = .35 + .25 * Math.sin(t * 10); ctx.fillStyle = '#ffd84a'; ctx.fillRect(gx - 7, gy - 5, 14, 11); ctx.globalAlpha = 1;
    ctx.drawImage(SPR.gold, gx - 5, gy - 4, 10, 8);
  }
  if (banner) {
    ctx.globalAlpha = Math.min(1, banner.life * 2);
    text(banner.text, W / 2, 3, banner.color, true);
    ctx.globalAlpha = 1;
  }
}

const stars = n => '★'.repeat(n);
const dupVal = st => rewardAt(S.maxStage) * {3:40, 4:160, 5:600}[st];
let gBanner = 'fw', lastPull = null;
const pityOf = (b, chip) => { const P = S.pity[b] || (S.pity[b] = {}); return P[chip] || (P[chip] = {p5:0, p4:0}); };
function pullOne(ban, chip, minStars) {
  const cls = banCls(ban), L = ban === 'L' ? launch() : null;
  const C = CHIPS[chip], P = pityOf(ban, chip), r = Math.random();
  P.p5++; P.p4++;
  let st = C.pity5 && P.p5 >= C.pity5 ? 5 : r < C.p5 ? 5 : C.pity4 && P.p4 >= C.pity4 ? 4 : r < C.p5 + C.p4 ? 4 : 3;
  st = Math.max(st, minStars, C.min || 3);
  if (st === 5) { P.p5 = 0; P.p4 = 0; }
  if (st === 4) P.p4 = 0;
  const pool = CLASSES[cls].list.filter(x => x.stars === st && released(x) && (L ? true : inStd(x)));
  const T = L && L.T.stars === st && Math.random() < FEAT_P ? L.T : pool[Math.random() * pool.length | 0];
  if (!(T.id in S.roster)) { S.roster[T.id] = 1; return {T, res:'new'}; }
  return addDup(T);
}
function summon(chip, n) {
  if (chipCount(chip) < n) return;
  let need = n;   // gasta primeiro os vinculados, pra preservar os negociáveis
  for (const b of [true, false]) {
    const st = S.inv.find(x => x.k === 'chip' && x.r === chip && !!x.b === b);
    if (!st || !need) continue;
    const k = Math.min(need, st.n); st.n -= k; need -= k;
    if (!st.n) S.inv.splice(S.inv.indexOf(st), 1);
  }
  const out = [];
  for (let i = 0; i < n; i++) {
    const needFour = CHIPS[chip].ten4 && n === 10 && i === n - 1 && !out.some(o => o.T.stars >= 4);
    out.push(pullOne(gBanner, chip, needFour ? 4 : 3));
  }
  lastPull = {cls: gBanner, out}; ev('pull', n);
  const best = out.reduce((a, o) => o.T.stars > a.T.stars ? o : a);
  const fr = out.filter(o => o.res === 'frag').reduce((a, o) => a + o.f, 0);
  if (best.T.stars === 5) { showBanner('★★★★★ ' + best.T.name, '#ffb454'); say(`<span style="color:#ffb454">★5 ${best.T.name}</span> baixado!`, true); }
  else say(`Download ×${n}: melhor ${stars(best.T.stars)} ${best.T.name}`);
  if (fr) say(`Repetidos de agentes na v2.0 → +${fr} fragmentos de código`);
  renderPanel(); save();
}

  if (!(id in S.roster)) return;

  if (it.k === 'chip') return it.b ? {ok:false, why:'pacote Comum de Chefão'} : {ok:true};

  if (it.lock && it.lock > nowMs()) return {ok:false, why:`recebido do mercado: trava até ${new Date(it.lock).toLocaleDateString('pt-BR')}`};
  return {ok:true};
}

  const left = Math.max(0, (raid ? RAID_TIME : STAGE_TIME) - stT);
  $('#secTxt').textContent = (raid ? raid.R.n : bossUp ? 'BOSS' : S.kills + '/' + ST().count) + ` · ${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`;
  $('#def').textContent = fmtN(S.def);
  $('#data').textContent = fmtNum(S.data);
  $('#pow').textContent = fmtN(power());
  $('#invN').textContent = invUsed() + '/' + invCap();
}
function clock() { const d = new Date(); $('#clock').textContent = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }

function offline(ms) {
  ctrSync();
  const sec_ = Math.min(ms / 1000, 8 * 3600);
  if (sec_ < 30) return;
  const gain = sec_ * rewardAt(S.stage) * .04 * (1 + tv('off') + glob('off')) * preCred();   // ~50% do ritmo online
  S.data += gain;
  let chips = 0;
  for (let c = 0; c < Math.floor(sec_ / 120); c++)
    for (let r = CHIPS.length - 1; r >= 0; r--) if (Math.random() < chipChance(r, false) * (1 + tv('off'))) { addItem({k:'chip', r, n:1}); chips++; break; }
  const h = Math.floor(sec_ / 3600), m = Math.floor(sec_ % 3600 / 60);
  say(`Enquanto você estava fora (${h ? h + 'h ' : ''}${m}min): +${fmt(gain)}${chips ? ` e ${chips} pacote(s) de download` : ''}`, true);
  showBanner('+' + fmt(gain) + ' OFFLINE', '#ffb454');
}

function resize() {
  const w = cv.parentElement.clientWidth;
  W = Math.max(160, Math.floor(w / SCALE));
  // canvas em resolução dobrada: a lógica continua em W×H, mas sprites das fichas e cenário ganham detalhe
  cv.width = W * RES; cv.height = H * RES;
  cv.style.width = W * SCALE + 'px'; cv.style.height = H * SCALE + 'px';
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
new ResizeObserver(resize).observe(cv.parentElement);
// clique no vírus dourado
const goldHit = ev => { if (!gold) return false; const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / SCALE, y = (ev.clientY - r.top) / SCALE; return Math.abs(x - gold.x) < 10 && Math.abs(y - gold.y) < 9; };
cv.addEventListener('click', ev => { if (goldHit(ev)) catchGold(); });
cv.addEventListener('mousemove', ev => { cv.style.cursor = goldHit(ev) ? 'pointer' : ''; });
resize();

say('daemon.exe iniciado.', true);
resetHeroes();
if (S.last) offline(nowMs() - S.last);
startStage(S.stage);
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = nowMs(); save(); }
  else if (hiddenAt) { offline(nowMs() - hiddenAt); hiddenAt = 0; }
});
ctrSync();
setInterval(metaSecond, 1000);
setInterval(save, 5000);
i18nStart();
setInterval(fitTabs, 1000);
setInterval(() => { renderHud(); livePanel(); if (livePanelQ && openP === 'quest') { livePanelQ = false; renderPanel(); } }, 250);
setInterval(clock, 10000); clock();
renderHud();

let lastT = performance.now();
function frame(now) {
  if (CFG.fps < 60 && now - lastT < 1000 / CFG.fps - 4) { requestAnimationFrame(frame); return; }
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  for (let i = 0; i < speed; i++) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
