<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daemon Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root{
    color-scheme:dark;
    --bg:#0e0c1d; --win:#17142b; --winhi:#201c3d; --line:#2e2856;
    --text:#e7e3ff; --mute:#8f89b8; --amber:#ffb454; --cyan:#5ce1e6;
    --pink:#ff3d7f; --green:#6ee7a8; --dock:#0a0916; --bar:#07060f;
    --mono:"IBM Plex Mono",ui-monospace,monospace; --pix:"Silkscreen",ui-monospace,monospace;
  }
  html,body{height:100%}
  body{background:var(--bg); color:var(--text); font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif; display:flex; flex-direction:column; overflow:hidden}

  /* área de trabalho falsa: o jogo mora só na barra de baixo */
  .desk{
    flex:1; position:relative; padding:16px;
    background:
      radial-gradient(700px 360px at 80% 20%, rgba(185,140,255,.10), transparent 70%),
      radial-gradient(500px 300px at 10% 90%, rgba(92,225,230,.07), transparent 70%),
      var(--bg);
  }
  .dicon{display:grid; justify-items:center; gap:4px; width:84px; padding:6px; background:none; border:1px solid transparent; box-shadow:none; color:var(--text); font:11px var(--mono); cursor:pointer}
  .dicon:hover{border-color:var(--line); background:rgba(255,255,255,.03)}
  .dicon .ic{width:34px; height:40px; background:var(--text); clip-path:polygon(0 0,72% 0,100% 22%,100% 100%,0 100%); position:relative}
  .dicon .ic::after{content:""; position:absolute; inset:14px 7px 8px; background:repeating-linear-gradient(#0e0c1d 0 2px, transparent 2px 5px)}
  .wm{position:absolute; right:16px; bottom:12px; margin:0; font:11px var(--mono); color:#4c4677}
  .wm b{font:400 12px var(--pix); color:#6b63a3}

  .dock{position:relative; background:var(--dock); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
  .hud{display:flex; align-items:center; gap:10px; height:28px; padding-inline:8px 6px; font:11px var(--mono); white-space:nowrap; overflow-x:auto; scrollbar-width:none}
  .hud::-webkit-scrollbar{display:none}
  .stg{font:400 11px var(--pix); color:var(--sec,var(--cyan)); background:none; border:0; box-shadow:none; padding:0 2px}
  .prog{flex:0 0 60px; height:5px; border:1px solid var(--line); background:#0b0a16}
  .prog i{display:block; height:100%; width:0; background:var(--sec,var(--cyan))}
  #secTxt{color:var(--mute); min-width:4ch; font-variant-numeric:tabular-nums}
  .cur{display:flex; gap:4px; align-items:baseline}
  .cur img{image-rendering:pixelated; align-self:center}
  .cur em{font-style:normal; color:var(--mute); font-size:10px; letter-spacing:.06em}
  .cur b{font:400 12px var(--pix); color:var(--amber); font-variant-numeric:tabular-nums}
  .cur.pw b{color:var(--cyan)}
  .tabs{display:flex; gap:2px; margin-left:auto}
  .tabs button{display:flex; align-items:center; gap:4px; padding:2px 6px; box-shadow:none; background:transparent; border-color:transparent; color:var(--mute)}
  .tabs button img{image-rendering:pixelated}
  @media (max-width:900px){ .tabs button span{display:none} }
  .tabs button:hover{color:var(--text); border-color:var(--line)}
  .tabs button[aria-pressed="true"]{color:var(--amber); border-color:var(--amber); background:#12102a}
  .tabs i{font-style:normal; color:var(--cyan)}
  #strip{display:block; image-rendering:pixelated; image-rendering:crisp-edges; border-top:1px solid #000}
  .taskbar{height:26px; display:flex; align-items:stretch; gap:2px; padding-inline:6px; background:var(--bar); border-top:1px solid #000; font:11px var(--mono); color:var(--mute); overflow:hidden; white-space:nowrap}
  .taskbar span{display:flex; align-items:center; padding-inline:9px}
  .start{color:var(--amber); font-size:14px}
  .task.on{color:var(--text); border-bottom:2px solid var(--amber); background:#12102a}
  .clock{margin-left:auto; font-variant-numeric:tabular-nums}

  /* painel que abre acima da barra */
  .panel{position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 10px); width:min(660px, calc(100% - 24px)); max-height:calc(100vh - 190px); display:flex; flex-direction:column; z-index:5;
    background:#0f0d1e; border:1px solid #5ce1e6; box-shadow:0 0 0 1px #000, 0 0 24px rgba(92,225,230,.18), 6px 6px 0 rgba(0,0,0,.55)}
  .panel.wide{width:min(1020px, calc(100% - 24px))}
  .panel[hidden]{display:none}
  .pbar{display:flex; align-items:center; gap:8px; padding:5px 6px 5px 8px; background:linear-gradient(90deg, #0f3a40, #16122c 60%); border-bottom:1px solid #1f5a60}
  .pbar img{image-rendering:pixelated}
  .ppath{margin:0; font:12px var(--mono); color:#7fd6da; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ppath span{color:#3f8f94} .ppath b{font:400 12px var(--pix); color:var(--text); letter-spacing:.06em; text-transform:uppercase}
  .pcur{margin-left:auto; font:11px var(--mono); color:var(--mute); padding:1px 8px; background:#0b0a16; border:1px solid #1f5a60; white-space:nowrap}
  .pcur b{font:400 11px var(--pix); color:var(--amber)} .pcur i{font-style:normal; color:var(--cyan)}
  .pwin{display:flex; gap:2px}
  .pwin i{display:grid; place-items:center; width:20px; height:18px; font:11px var(--mono); font-style:normal; color:#3f8f94; border:1px solid #1f5a60}
  .pwin button{width:22px; height:18px; padding:0; box-shadow:none; background:#3a1024; border-color:#ff3d7f; color:#ffd0dc}
  .pmain{display:flex; min-height:0; flex:1}
  .pnav{display:flex; flex-direction:column; gap:2px; padding:6px 4px; background:#0a0918; border-right:1px solid #1f5a60}
  .nb{position:relative; display:grid; justify-items:center; gap:1px; width:54px; padding:5px 2px 3px; background:none; border:1px solid transparent; box-shadow:none}
  .nb img{image-rendering:pixelated}
  .nb span{font:9px var(--mono); color:var(--mute)}
  .nb:hover{background:#15122b; border-color:#1f5a60}
  .nb[aria-pressed="true"]{background:#10272b; border-color:#1f5a60}
  .nb[aria-pressed="true"]::before{content:""; position:absolute; left:-5px; top:6px; bottom:6px; width:3px; background:var(--cyan)}
  .nb[aria-pressed="true"] span{color:var(--cyan)}
  .pbody{flex:1; min-width:0; overflow:auto; padding:12px; font:12px/1.45 var(--mono);
    background:linear-gradient(rgba(92,225,230,.03) 1px, transparent 1px) 0 0/100% 3px}
  .pstatus{display:flex; flex-wrap:wrap; gap:4px 16px; padding:3px 10px; font:10px var(--mono); color:#3f8f94; background:#0a0918; border-top:1px solid #1f5a60}
  .pstatus .ok{color:var(--green)}
  /* árvore do antivírus */
  .tree2{display:grid; grid-template-columns:1fr 250px; gap:10px; min-height:0}
  .tmap{position:relative; height:min(470px, calc(100vh - 290px)); overflow:auto; cursor:grab; border:1px solid #1f5a60; user-select:none;
    background:radial-gradient(circle at 50% 50%, rgba(255,180,84,.08), transparent 45%), linear-gradient(rgba(46,40,86,.5) 1px, transparent 1px) 0 0/25px 25px, linear-gradient(90deg, rgba(46,40,86,.5) 1px, transparent 1px) 0 0/25px 25px, #09081a;
    scrollbar-width:thin}
  .tmap.dragging{cursor:grabbing}
  .tcan{position:relative}
  .tcan svg{position:absolute; inset:0; pointer-events:none; z-index:0}
  .tn:active:not(:disabled), .tn:hover{transform:translate(-50%, -50%)}
  .tn.pop{animation:tpop .35s}
  @keyframes tpop{50%{transform:translate(-50%, -50%) scale(1.3)}}
  .tn{position:absolute; z-index:1; transform:translate(-50%, -50%); display:grid; place-items:center; width:32px; height:32px; padding:0; background:#110f24; border:2px solid #2e2856; box-shadow:none}
  .tn img{image-rendering:pixelated}
  .tn small{position:absolute; bottom:-9px; font:8px var(--mono); color:var(--mute); background:#09081a; padding:0 2px}
  .tn.locked{opacity:.35}
  .tn.open{border-color:var(--bc); border-style:dashed}
  .tn.has{border-color:var(--bc); background:color-mix(in srgb, var(--bc) 18%, #110f24); box-shadow:0 0 8px color-mix(in srgb, var(--bc) 45%, transparent)}
  .tn.max small{color:var(--bc)}
  .tn.key{width:42px; height:42px; clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); border-width:0; background:color-mix(in srgb, var(--bc) 30%, #110f24)}
  .tn.key.has{background:var(--bc)}
  .tn.core{width:48px; height:48px; border-color:var(--amber); border-radius:50%; background:#2a1d08; box-shadow:0 0 18px rgba(255,180,84,.45)}
  .tn.sel{outline:2px solid #ffffff; outline-offset:2px}
  .tside > * + *{margin-top:8px}
  .tside{display:block; font-size:11px; max-height:min(470px, calc(100vh - 290px)); overflow:auto}
  .tdef b{font:400 14px var(--pix)}
  .tsum{padding:4px 0; border-top:1px dashed var(--line)}
  .tsum small{color:var(--mute)}
  @media (max-width:760px){ .tree2{grid-template-columns:1fr} .tside{max-height:none} .pnav{display:none} }
  /* tela de agente: diagnóstico */
  .procs{display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; margin-bottom:8px}
  .proc{display:grid; grid-template-columns:24px 1fr; gap:2px 8px; align-items:center; padding:4px 6px; text-align:left; background:#0b0a16; border:1px solid #1f5a60; box-shadow:none}
  .proc img{image-rendering:pixelated; grid-row:1 / span 2}
  .proc b{display:block; font:600 11px var(--mono); color:var(--text)}
  .proc small{font-size:9px; color:#3f8f94}
  .proc .mini{grid-column:2; height:3px; background:#1a1733; display:block}
  .proc .mini i{display:block; height:100%; background:var(--green)}
  .proc.on{border-color:var(--cyan); background:#0e2629}
  .dx{display:grid; grid-template-columns:150px 1fr; gap:12px}
  .scan{display:grid; justify-items:center; gap:3px; text-align:center}
  .chamber{position:relative; width:120px; height:120px; display:grid; place-items:center; overflow:hidden;
    background:linear-gradient(rgba(92,225,230,.12) 1px, transparent 1px) 0 0/100% 8px, radial-gradient(circle, #123338, #070612 70%);
    border:1px solid #1f5a60}
  .chamber::before,.chamber::after{content:""; position:absolute; width:14px; height:14px; border:2px solid var(--cyan)}
  .chamber::before{left:3px; top:3px; border-right:0; border-bottom:0}
  .chamber::after{right:3px; bottom:3px; border-left:0; border-top:0}
  .chamber img{image-rendering:pixelated; position:relative}
  .beam{position:absolute; left:0; right:0; height:2px; background:rgba(92,225,230,.75); box-shadow:0 0 8px var(--cyan); animation:beam 2.6s linear infinite}
  @keyframes beam{from{top:0} to{top:100%}}
  @media (prefers-reduced-motion:reduce){ .beam{animation:none; top:50%} }
  .scan .nm{font:400 12px var(--pix)}
  .scan .rl{font-size:10px; color:var(--mute); text-transform:uppercase; letter-spacing:.05em}
  .scan .stat{font-size:9px; letter-spacing:.08em} .scan .ok{color:var(--green)} .scan .bad{color:var(--pink)}
  .socks{display:grid; gap:3px; align-content:start}
  .socks .lbl{margin:0 0 2px; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:#3f8f94}
  .sock{position:relative; display:grid; grid-template-columns:28px 78px 1fr auto; align-items:center; gap:6px; padding:3px 6px; text-align:left;
    background:#0b0a16; border:1px solid #1a1733; border-left:3px solid var(--rc, #2e2856); box-shadow:none; font-size:11px}
  .sock img{image-rendering:pixelated}
  .sock .sn{font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute)}
  .sock .si{color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sock b{font:400 10px var(--pix); color:var(--rc)}
  .sock .setd{position:absolute; left:32px; top:3px; width:5px; height:5px}
  .sock.empty{opacity:.55; border-left-style:dashed}
  .sock.empty .ph{display:grid; place-items:center; width:24px; height:24px; border:1px dashed #2e2856; font-size:8px; color:var(--mute)}
  .sock.empty .si{color:var(--mute)}
  .rd{display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; margin-top:10px; padding:8px 10px; background:#070612; border:1px solid #1f5a60}
  .rd .hp{grid-column:1 / -1; margin:0 0 4px}
  .rd .st div{display:flex; gap:6px; font-size:11px}
  .rd .st span{color:#7fd6da} .rd .st i{flex:1; border-bottom:1px dotted #1f5a60; margin-bottom:4px} .rd .st b{color:var(--text)}
  .cmds{display:grid; gap:4px; align-content:start}
  .cmds button{text-align:left; background:#0e2629; border-color:#1f5a60; font-size:11px; display:flex; justify-content:space-between; gap:6px}
  .cmds small{color:var(--mute)}
  .cmds b img{image-rendering:pixelated; vertical-align:-1px}
  .tip{position:fixed; z-index:50; width:280px; padding:8px 10px; pointer-events:none; font:11px/1.45 var(--mono); color:var(--text);
    background:#0a0918; border:1px solid var(--cyan); box-shadow:0 0 0 1px #000, 0 6px 18px rgba(0,0,0,.6)}
  .tip .th{display:flex; gap:8px; align-items:center; margin-bottom:4px}
  .tip img{image-rendering:pixelated}
  .tip .tl{padding:3px 0; border-top:1px dashed #1f2a44}
  .tip .tv{margin-top:4px; color:var(--amber)}
  .panel[hidden]{display:none}
  .pbody p{margin:0 0 8px}
  .hint{color:var(--mute)}
  button{font:11px var(--mono); color:var(--text); background:var(--winhi); border:1px solid var(--line); padding:3px 8px; cursor:pointer; box-shadow:2px 2px 0 #000}
  button:hover:not(:disabled){border-color:var(--amber)}
  button:active:not(:disabled){transform:translate(1px,1px); box-shadow:1px 1px 0 #000}
  button:disabled{opacity:.4; cursor:default}
  button b{color:var(--amber); font-weight:600}
  button:focus-visible,input:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  label{display:inline-flex; align-items:center; gap:5px; color:var(--mute); cursor:pointer}
  .opts{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; padding-top:8px; border-top:1px dashed var(--line)}
  /* esquadrão */
  .hr{display:grid; grid-template-columns:48px 1fr auto; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line)}
  .hr img{image-rendering:pixelated}
  .hn{display:flex; gap:8px; align-items:baseline}
  .hn b{font:400 12px var(--pix)}
  .hn span{color:var(--mute); font-size:10px; text-transform:uppercase; letter-spacing:.06em}
  .hp{height:4px; background:#0b0a16; border:1px solid var(--line); margin:3px 0}
  .hp i{display:block; height:100%; background:var(--green)}
  .st{color:var(--mute); font-size:11px; font-variant-numeric:tabular-nums}
  .gear{color:var(--rc); font-size:11px}
  .eqrow{display:flex; gap:3px; margin-top:4px}
  .eqs{position:relative; display:grid; place-items:center; width:30px; height:30px; padding:0; background:#0b0a16; border:1px solid var(--rc, var(--line)); box-shadow:inset 0 -2px 0 var(--rc, transparent); font:9px var(--mono); color:var(--mute)}
  .eqs img{image-rendering:pixelated}
  .eqs i{position:absolute; right:1px; bottom:0; font:400 7px var(--pix); color:var(--rc); font-style:normal}
  .eqs.empty{border-style:dashed; box-shadow:none; opacity:.6}
  .gear button{padding:0 5px; box-shadow:none; font-size:10px; margin-left:4px}
  .hb{display:grid; gap:4px}
  .hb button{text-align:left}
  .prev{display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:8px; color:var(--mute); font-size:11px}
  .prev button{padding:1px 5px; box-shadow:none; color:var(--rc)}
  .prev button[aria-pressed="true"]{border-color:currentColor; background:#0b0a16}

  /* inventário */
  .inv{display:grid; grid-template-columns:repeat(6, 52px); gap:4px; justify-content:center}
  .cell{aspect-ratio:1; max-width:100%; display:grid; place-content:center; gap:1px; padding:0; background:#0b0a16; border:1px solid var(--line); box-shadow:inset 0 -3px 0 var(--rc,transparent); color:var(--rc); text-align:center}
  .cell.empty{border-style:dashed; opacity:.5; box-shadow:none}
  .cell .ct{font:9px var(--mono); color:var(--mute)}
  .cell img{image-rendering:pixelated; justify-self:center}
  .cell b{font:400 11px var(--pix); color:var(--rc)}
  .cell{position:relative}
  .setd{position:absolute; left:3px; top:3px; width:6px; height:6px}
  .afd{position:absolute; right:3px; top:1px; font:10px var(--mono); color:#c38cff}
  .af{color:#c38cff}
  .sets{font-size:11px; margin-top:3px; color:var(--mute)}
  .sets .on{color:var(--text)} .sets .off{opacity:.6}
  .setlist{margin-top:6px; font-size:11px; color:var(--mute)}
  .rates{border-collapse:collapse; font-variant-numeric:tabular-nums}
  .rates td{padding:1px 8px 1px 0}
  .rates td:nth-child(n+2){text-align:right}
  .setlist summary{cursor:pointer; color:var(--text)}
  .cell.dim{opacity:.3}
  .inv.comp{grid-template-columns:repeat(5, 56px); margin:6px 0}
  .cinfo{font-size:11px; color:var(--mute); margin:6px 0}
  .row{display:flex; flex-wrap:wrap; gap:6px}
  .cell.sel{border-color:var(--amber); outline:1px solid var(--amber)}
  .det{margin-top:10px; padding:8px 10px; border:1px solid var(--line); background:#0b0a16; min-height:58px}
  .dh{display:flex; gap:8px; align-items:center; margin-bottom:4px}
  .dh img{image-rendering:pixelated}
  .drops{margin-top:8px; font-size:11px}
  .chip img{image-rendering:pixelated; vertical-align:middle}
  .det .row{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}

  /* invocar */
  .btabs{display:flex; gap:4px; margin-bottom:8px}
  .btabs button[aria-pressed="true"]{border-color:var(--amber); color:var(--amber); background:#0b0a16}
  .chips{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px}
  .chip{display:grid; gap:3px; padding:6px 8px; border:1px solid var(--line); border-top:3px solid var(--rc); background:#0b0a16}
  .chip b{color:var(--rc); font-weight:600}
  .chip small{color:var(--mute); font-size:10px}
  .chip div{display:flex; gap:4px}
  .pity{margin:8px 0 4px; color:var(--mute); font-size:11px}
  .res,.col{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:5px}
  .card{display:grid; justify-items:center; align-content:start; gap:2px; padding:6px 4px; background:#0b0a16; border:1px solid var(--line); text-align:center; font-size:10px; line-height:1.3}
  .card img{image-rendering:pixelated}
  .card .nm{color:var(--text); font-weight:600}
  .card .ps{color:var(--mute)}
  .card button{width:100%; padding:2px 4px; box-shadow:none; margin-top:3px}
  .card.lock img{filter:brightness(0); opacity:.5}
  .card.on{outline:2px solid var(--amber); outline-offset:-2px}
  .s5{border-color:#ffb454} .s4{border-color:#c38cff}
  .st5{color:#ffb454} .st4{color:#c38cff} .st3{color:#5ca8ff}
  .tag{font-size:9px; letter-spacing:.06em; padding:0 4px; border:1px solid currentColor}
  .tag.new{color:var(--amber)} .tag.dup{color:var(--green)}
  .res .card{animation:pop .3s both; animation-delay:calc(var(--i) * 90ms)}
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(.92)} to{opacity:1; transform:none}}
  .sub{margin:10px 0 6px; font-weight:600; font-size:11px; letter-spacing:.06em; color:var(--text)}
  .sub small{color:var(--mute); font-weight:400}

  /* fases */
  .stl{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:3px}
  .tree{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:8px 0}
  .br{display:grid; gap:6px; align-content:start; justify-items:center; padding:6px 4px; border:1px solid var(--line); background:#0b0a16; font-size:11px}
  .trow{display:flex; gap:6px; position:relative}
  .trow + .trow::before{content:""; position:absolute; left:50%; top:-7px; height:6px; border-left:1px solid var(--line)}
  .node{display:grid; place-items:center; width:40px; height:40px; padding:0; border:1px solid var(--line); background:var(--winhi); box-shadow:none; line-height:1.1}
  .node span{font:400 10px var(--pix); color:var(--bc)}
  .node small{font-size:9px; color:var(--mute)}
  .node.has{border-color:var(--bc); box-shadow:inset 0 0 8px color-mix(in srgb, var(--bc) 35%, transparent)}
  .node.closed{opacity:.35}
  .node:disabled{cursor:default}
  .node:disabled:not(.closed){opacity:1}
  .tlist{margin:6px 0 0; padding-left:16px; font-size:11px; color:var(--text)}
  .stl li{display:grid; grid-template-columns:3.2em 1fr auto auto; gap:10px; align-items:center; padding:3px 6px; border:1px solid transparent}
  .stl li.cur{border-color:var(--amber); background:#0b0a16}

<script>
(() => {
const $ = s => document.querySelector(s);
const SCALE = 2, H = 52, GROUND = 47, KEY = 'daemonbar.v2';
const cv = $('#strip'), ctx = cv.getContext('2d');
let W = 320;

// ---------- sprites ----------
function mk(rows, pal, white) {
  const c = document.createElement('canvas');
  c.width = Math.max(...rows.map(r => r.length)); c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => {
    if (pal[ch]) { g.fillStyle = white ? '#ffffff' : pal[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return c;
}
const ART = {
  bug: [[
    'a........a','.a......a.','..abbbba..','.abcbbcba.','abbbbbbbba',
    '.abbbbbba.','a.abbbba.a','..a....a..'],
    {a:'#6b1238',b:'#ff3d7f',c:'#ffffff'}],
  worm: [[
    '.aa.......','abca..aa..','abbba.abba','.abbbabbba','..abbbbba.','...aaaaa..'],
    {a:'#2b4a0a',b:'#a6e22e',c:'#ffffff'}],
  trojan: [[
    'aaaaaaaaaa','abbbbbbbba','abccbbccba','abbbbbbbba','abbddddbba',
    'abbbbbbbba','aaaaaaaaaa','.a......a.'],
    {a:'#4a2a00',b:'#b86b12',c:'#ff3d7f',d:'#2a1600'}],
  boss: [[
    '...aaaa...','..a....a..','..a....a..','aaaaaaaaaa','abbbbbbbba',
    'abbbccbbba','abbbccbbba','abbbbcbbba','abbbbbbbba','aaaaaaaaaa'],
    {a:'#3d0a1f',b:'#ff3d7f',c:'#ffb454'}],
};
// ---------- agentes 32x32, pintados por camadas ----------
// Cada agente é desenhado de trás pra frente num grid 32x32 e recebe contorno automático.
// f = quadro das pernas (0/1), v = variação de pano (capa/cachecol), t = raridade (-1…4), glow = cor das luzes.
function Painter(w, h) {
  const g = new Array(w * h).fill(null);
  const P = {
    set(x, y, c) {
      x = Math.round(x); y = Math.round(y);
      if (c && x >= 0 && y >= 0 && x < w && y < h) g[y * w + x] = typeof c === 'function' ? c(x, y) : c;
    },
    rect(x, y, rw, rh, c) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) P.set(x + i, y + j, c); },
    line(x0, y0, x1, y1, c, th = 1) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy, o = th >> 1;
      for (;;) {
        P.rect(x0 - o, y0 - o, th, th, c);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
    },
    poly(pts, c) {
      const ys = pts.map(p => p[1]);
      for (let y = Math.floor(Math.min(...ys)); y <= Math.ceil(Math.max(...ys)); y++) {
        const yc = y + .5, xs = [];
        pts.forEach((a, i) => {
          const b = pts[(i + 1) % pts.length];
          if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
        });
        xs.sort((m, n) => m - n);
        for (let i = 0; i + 1 < xs.length; i += 2)
          for (let x = Math.round(xs[i]); x <= Math.round(xs[i + 1]) - 1; x++) P.set(x, y, c);
      }
    },
    ell(cx, cy, rx, ry, c) {
      for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++)
        if ((x * x) / (rx * rx + .5) + (y * y) / (ry * ry + .5) <= 1) P.set(cx + x, cy + y, c);
    },
    outline(c) {
      const src = g.slice();
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (src[y * w + x]) continue;
        const n = (x > 0 && src[y * w + x - 1]) || (x < w - 1 && src[y * w + x + 1]) || (y > 0 && src[(y - 1) * w + x]) || (y < h - 1 && src[(y + 1) * w + x]);
        if (n) g[y * w + x] = c;
      }
    },
    canvas(white) {
      const cnv = document.createElement('canvas'); cnv.width = w; cnv.height = h;
      const cx = cnv.getContext('2d');
      g.forEach((c, i) => { if (c) { cx.fillStyle = white ? '#ffffff' : c; cx.fillRect(i % w, i / w | 0, 1, 1); } });
      return cnv;
    },
  };
  return P;
}
function mix(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = sh => Math.round(((pa >> sh) & 255) * (1 - k) + ((pb >> sh) & 255) * k);
  return '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
}
// Perna com joelho levemente à frente; o pé fica em y=30.
function leg(P, hx, hy, fx, thigh, shin, boot, th) {
  const kx = (hx + fx) / 2 + 1, ky = (hy + 30) / 2;
  P.line(hx, hy, kx, ky, thigh, th);
  P.line(kx, ky, fx, 28, shin, th);
  P.rect(fx - 1, 29, th + 2, 2, boot);
}
const stride = f => f ? [2, -2] : [-3, 3];   // deslocamento do pé [de trás, da frente]

const HERO_ART = {
  // FIREWALL: sobretudo, armadura preta com linhas de energia, cabelo cobre espetado,
  // lâmina pesada apontada pro chão e escudo hexagonal de energia na frente.
  fw: {w:30, base:'#5ce1e6', line:'#000000', cloth:1, draw(P, f, v, t, gl) {
    const A = '#2a2a3a', A2 = '#1f1f2b', B = '#4a4a62', C = '#aab0c4', K = '#1d1d28', K2 = '#30303f',
          S = '#e8b896', Hc = '#e0613f', H2 = '#a8432a', E = '#3a3a4c', dim = mix(gl, '#000000', .6);
    P.poly([[10, 11], [19, 11], [23, 29], [6, 29]], (x) => x < 9 || x > 20 ? K2 : K);
    if (t >= 3) P.line(6, 28, 23, 28, gl);
    const [bf, ff] = stride(f);
    leg(P, 12, 21, 12 + bf, A2, A2, '#565a74', 3);
    P.poly([[5, 16], [9, 16], [6, 31], [2, 31]], E);
    P.line(5, 17, 2, 30, gl);
    if (t >= 4) P.line(9, 17, 6, 30, gl);
    P.line(11, 12, 8, 16, A2, 3);
    P.rect(5, 15, 6, 2, C);
    leg(P, 16, 21, 16 + ff, A, B, C, 3);
    P.poly([[10, 10], [20, 10], [18, 22], [11, 22]], A);
    P.line(12, 13, 14, 16, gl); P.line(14, 16, 17, 13, gl);
    P.line(12, 19, 17, 19, B); P.set(14, 20, gl); P.set(15, 20, gl);
    P.ell(10, 12, 3, 2, B); P.ell(19, 12, 3, 2, B);
    P.line(8, 10, 12, 10, C); P.line(17, 10, 21, 10, C);
    if (t >= 3) { P.set(8, 9, C); P.set(7, 8, C); P.set(21, 9, C); P.set(22, 8, C); }
    P.rect(12, 8, 7, 2, C);
    P.rect(13, 3, 5, 6, S);
    P.set(16, 5, '#1a1020'); P.set(17, 7, mix(S, '#000000', .3));
    P.poly([[11, 6], [11, 2], [13, 3], [14, 0], [16, 2], [18, 0], [19, 3], [20, 2], [19, 5], [16, 4], [13, 5]], Hc);
    P.line(12, 2, 9, 1, Hc); P.line(11, 4, 8, 4, H2); P.line(13, 4, 17, 3, H2);
    P.set(13, 6, gl);
    if (t >= 4) { P.set(14, 0, gl); P.set(18, 0, gl); P.set(9, 1, gl); }
    P.line(19, 12, 22, 16, A, 3); P.rect(21, 15, 3, 3, B);
    const r = t >= 2 ? 6 : 5, cx = 26, cy = 17;
    const hex = [[cx, cy - r], [cx + r * .87, cy - r / 2], [cx + r * .87, cy + r / 2], [cx, cy + r], [cx - r * .87, cy + r / 2], [cx - r * .87, cy - r / 2]];
    P.poly(hex, dim);
    hex.forEach((p, i) => { const q = hex[(i + 1) % 6]; P.line(p[0], p[1], q[0], q[1], gl); });
    P.line(cx, cy - 2, cx, cy + 2, '#ffffff'); P.line(cx - 1, cy, cx + 1, cy, '#ffffff');
  }},
  // SCANNER: cabelo prateado, óculos de visor, armadura branca e marinho,
  // cachecol magenta esvoaçante e railgun que cresce com a raridade.
  sc: {w:30, base:'#5ce1e6', line:'#141a2e', cloth:2, draw(P, f, v, t, gl) {
    const W1 = '#e9ecf5', W2 = '#b9c0d6', N = '#2a3561', N2 = '#1d2547', S = '#f1c7a8',
          Hh = '#d4d8ee', H2 = '#8a90b0', R = '#ff3d7f', R2 = '#b0204f', K = '#3a3f5c', K2 = '#6b7194';
    for (let i = 0; i < 11; i++) {
      const x = 12 - i, y = 9 + Math.round(Math.sin(i * .8 + v * 2.2) * 1.4) + (i >> 2);
      P.rect(x, y, 1, 2, i % 4 === 3 ? R2 : R);
    }
    P.ell(13, 6, 4, 4, H2);
    const [bf, ff] = stride(f);
    leg(P, 13, 20, 13 + bf, N2, N2, N2, 2);
    P.line(13, 11, 15, 16, N2, 2);
    leg(P, 16, 20, 16 + ff, W1, N, N, 2);
    P.set(17 + ff / 2, 24, W2);
    P.poly([[12, 10], [19, 10], [18, 21], [12, 21]], N);
    P.poly([[12, 11], [19, 11], [18, 16], [13, 16]], W1);
    P.line(13, 16, 17, 16, W2);
    P.line(12, 18, 18, 18, K2);
    P.rect(11, 10, 2, 3, W2); P.rect(17, 10, 3, 3, W1);
    P.rect(12, 8, 7, 2, R); P.line(12, 9, 18, 9, R2);
    P.rect(13, 3, 5, 5, S);
    P.ell(15, 2, 4, 2, Hh); P.rect(11, 2, 3, 7, Hh); P.line(11, 8, 10, 10, Hh);
    P.line(14, 3, 18, 3, Hh); P.set(18, 4, Hh);
    P.line(11, 5, 13, 5, H2);
    P.rect(14, 5, 5, 2, gl); P.set(18, 5, '#ffffff');
    P.set(16, 8, mix(S, '#000000', .25));
    const L = 26 + Math.max(0, t);
    P.rect(9, 14, 5, 3, K);
    P.rect(13, 13, L - 13, 3, K); P.line(13, 13, L - 1, 13, K2);
    for (let x = 16; x < L - 1; x += 3) P.set(x, 15, gl);
    P.rect(L, 13, 1, 3, gl);
    if (t >= 3) { P.rect(17, 11, 4, 2, K2); P.set(20, 11, gl); }
    P.line(18, 11, 22, 15, W1, 2); P.set(22, 16, S); P.set(15, 17, S);
  }},
  // PATCHER: cabelo branco longo, faixa-visor, armadura branco-lavanda,
  // capa pastel iridescente e cajado emissor de nanobots.
  pt: {w:26, base:'#c9b8ff', line:'#2a2640', cloth:2, draw(P, f, v, t, gl) {
    const A = '#dcd8f0', A2 = '#8b86ad', Hh = '#f2f0ff', H2 = '#b9b3de', S = '#7a4a33', S2 = '#5e3726', T = '#8b86ad';
    const iri = (x, y) => ['#e8c8f5', '#bfe3ff', '#d9d2ff'][((x + y + v * 3) >> 1) % 3];
    const bot = t >= 2 ? 31 : 29;

    P.poly([[11, 3], [16, 3], [14, 17], [9, 15]], H2);
    const [bf, ff] = stride(f);
    leg(P, 13, 20, 13 + bf, S2, A2, A2, 2);

    P.set(17 + ff / 2, 24, A2);
    P.poly([[12, 10], [18, 10], [17, 21], [13, 21]], A);
    P.line(15, 16, 15, 20, A2);
    P.rect(14, 12, 2, 2, gl);
    P.ell(12, 11, 2, 1, A2); P.ell(18, 11, 2, 1, A2);
    P.rect(13, 3, 5, 6, S);
    P.rect(13, 5, 6, 2, A2); P.line(14, 5, 18, 5, gl);
    P.set(17, 8, '#3a1c14');
    P.ell(15, 2, 4, 2, Hh); P.rect(11, 2, 3, 6, Hh); P.line(12, 1, 9, 0, Hh); P.line(11, 8, 10, 13, Hh);
    P.line(18, 11, 22, 15, A, 2); P.set(23, 15, S);
    P.line(24, 6, 24, 30, T); P.line(23, 7, 25, 7, T);
    const orb = t >= 3 ? 2 : 1;
    P.ell(24, 3, orb + 1, orb + 1, mix(gl, '#000000', .45)); P.ell(24, 3, orb, orb, gl); P.set(24, 3, '#ffffff');
    if (t >= 3) { P.set(20, 3, gl); P.set(28, 3, gl); P.set(24, 0, gl); }
  }},
};
// Mecha pesado configurável, usado pelos tanques invocados.
// o: A (armadura), A2 (sombra), B (placas claras), C (acabamento), coat, visor, shield, weapon, drone…
function mech(o) {
  return (P, f, v, t, gl) => {
    const dim = mix(gl, '#000000', .55), M = o.metal || '#2e2a2a', M2 = mix(M, '#ffffff', .25);
    if (o.coat) P.poly([[10, 11], [21, 11], [25, 29], [6, 29]], x => x < 9 || x > 22 ? mix(o.coat, '#ffffff', .1) : o.coat);
    if (o.drone) {
      const dy = v ? 1 : 0;
      P.ell(4, 4 + dy, 2, 2, o.drone); P.set(2, 4 + dy, mix(o.drone, '#000000', .4));
      P.set(5, 4 + dy, gl); P.set(3, 7 + dy, gl);
    }
    const [bf, ff] = stride(f);
    leg(P, 12, 20, 12 + bf, o.A2, o.A2, mix(o.A2, '#000000', .3), 4);
    if (o.weapon === 'gunblade') {
      P.line(11, 16, 4, 23, M, 3); P.line(9, 18, 7, 20, o.B, 1);
      P.line(4, 23, 0, 29, o.blade, 2); P.line(5, 25, 2, 29, gl);
    } else if (o.weapon === 'claw') {
      P.line(11, 16, 6, 21, M, 4); P.line(8, 18, 9, 19, o.C);
      P.line(5, 21, 2, 20, M2); P.line(5, 22, 2, 25, M2); P.line(6, 23, 5, 26, M2);
      if (o.orb) { P.ell(2, 23, 2, 2, dim); P.ell(2, 23, 1, 1, gl); }
    } else {
      P.line(11, 16, 1, 22, M, 3); P.rect(6, 16, 4, 2, M2); P.set(1, 22, gl); P.set(0, 23, gl);
    }
    P.line(12, 11, 10, 16, o.A2, 4);
    leg(P, 17, 20, 17 + ff, o.A, o.B, o.C, 4);
    P.ell(18 + ff / 2, 25, 1, 1, o.B);
    P.poly([[10, 8], [22, 8], [20, 20], [12, 20]], o.A);
    P.line(14, 15, 18, 15, o.A2); P.line(14, 17, 18, 17, o.A2); P.line(16, 14, 16, 19, o.A2);
    const cr = t >= 4 ? 3 : 2;
    P.ell(16, 11, cr, cr, dim); P.ell(16, 11, cr - 1, cr - 1, gl); P.set(16, 11, '#ffffff');
    P.ell(10, 10, 4, 3, o.B); P.line(7, 8, 13, 8, o.C);
    if (t >= 3) { P.set(8, 6, o.C); P.set(9, 7, o.C); P.set(11, 6, o.C); }
    P.rect(13, 1, 7, 7, o.A); P.line(14, 1, 18, 1, o.B); P.rect(13, 6, 7, 2, o.A2);
    P.rect(15, 3, 5, 3, o.A2);
    if (o.visor === 'eyes') { P.set(16, 4, gl); P.set(18, 4, gl); }
    else if (o.visor === 'dots') { [[15, 3], [17, 3], [19, 3], [16, 4], [18, 4], [17, 5]].forEach(q => P.set(q[0], q[1], gl)); }
    else { P.line(15, 3, 19, 3, gl); P.line(17, 4, 17, 5, gl); }
    P.ell(22, 10, 4, 3, o.B);
    P.line(22, 11, 24, 15, o.A, 4);
    if (o.shield === 'gear') {
      const g = t >= 2 ? 1 : 0;
      for (const w of [[[23, 3 - g], [28, 1 - g], [30, 12], [24, 12]], [[24, 20], [30, 20], [28, 31], [23, 29 + g]]]) {
        P.poly(w, dim); w.forEach((a, i) => { const b = w[(i + 1) % 4]; P.line(a[0], a[1], b[0], b[1], gl); });
      }
      for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4; P.set(26 + Math.cos(an) * 5, 16 + Math.sin(an) * 5, o.C); }
      P.ell(26, 16, 4, 4, o.B); P.ell(26, 16, 2, 2, o.A2); P.set(26, 16, gl);
    } else if (o.shield === 'tower') {
      const sh = [[22, 5], [29, 6], [30, 26], [23, 28]];
      P.poly(sh, o.shieldCol); sh.forEach((a, i) => { const b = sh[(i + 1) % 4]; P.line(a[0], a[1], b[0], b[1], o.C); });
      P.line(26, 9, 26, 24, gl); P.line(24, 15, 29, 15, gl);
      P.line(24, 10, 24, 13, o.gold); P.line(28, 10, 28, 13, o.gold); P.line(24, 18, 25, 22, o.gold); P.line(28, 18, 27, 22, o.gold);
      if (t >= 2) { P.line(29, 8, 30, 24, gl); P.line(23, 7, 23, 26, dim); }
      P.ell(26, 15, 1, 1, '#ffffff');
    } else {
      for (let a = -70; a <= 70; a += 6) { const r = a * Math.PI / 180; P.set(25 + Math.cos(r) * (t >= 2 ? 6 : 5), 15 + Math.sin(r) * 10, gl); }
      P.rect(24, 14, 2, 3, o.B);
    }

function soldier(o) {
  return (P, f, v, t, gl) => {
    const dim = mix(gl, '#000000', .55), M = o.metal || '#2a2d36', M2 = mix(M, '#ffffff', .25), acc = o.acc || gl;

      P.rect(x, y, 1, 2, i % 4 === 3 ? mix(o.scarf, '#000000', .35) : o.scarf);
    }
    if (o.treads) { P.rect(7, 5, 5, 13, '#2a2a22'); for (let y = 6; y < 17; y += 2) P.set(8, y, '#5a5a44'); P.rect(8, 4, 3, 1, '#3a3a30'); }
    if (o.quiver) { P.rect(9, 7, 3, 10, o.quiver); P.line(10, 7, 9, 3, '#c9c3b0'); P.line(11, 7, 12, 3, '#c9c3b0'); P.set(9, 3, gl); P.set(12, 3, gl); }
    if (o.pack) P.rect(9, 9, 3, 8, o.pack);
    if (o.drone) { const dy = v ? 1 : 0; P.ell(4, 4 + dy, 2, 1, o.drone); P.line(1, 3 + dy, 7, 3 + dy, mix(o.drone, '#000000', .3)); P.set(5, 5 + dy, gl); }
    const [bf, ff] = stride(f);
    leg(P, 13, 20, 13 + bf, o.A2, o.A2, mix(o.A2, '#000000', .3), 3);
    P.line(13, 11, 15, 16, o.A2, 2);
    leg(P, 16, 20, 16 + ff, o.B, o.A, o.boot || o.A2, 3);
    if (o.treads) { P.rect(15 + ff, 28, 6, 3, '#2a2a22'); P.set(16 + ff, 29, '#5a5a44'); P.set(18 + ff, 29, '#5a5a44'); }
    P.ell(17 + ff / 2, 24, 1, 1, o.B);
    P.poly([[12, 10], [19, 10], [18, 21], [12, 21]], o.A);
    P.poly([[12, 11], [19, 11], [18, 15], [13, 15]], o.B);
    P.line(13, 16, 17, 16, acc); P.line(15, 17, 15, 18, acc);
    P.line(12, 19, 18, 19, M2);
    P.ell(12, 11, 2, 2, o.B); P.ell(19, 11, 2, 2, o.B);

      P.set(12, 0, o.hair); P.set(14, 0, o.hair); P.set(17, 0, o.hair); P.line(11, 8, 10, 10, o.hair);
      if (o.mask) P.rect(14, 6, 5, 2, o.mask);

    } else {
      P.ell(15, 5, 4, 4, o.A); P.line(13, 1, 17, 1, o.B);
      P.rect(15, 4, 4, 2, gl); P.set(18, 4, '#ffffff'); P.rect(12, 7, 7, 1, o.A2);
      if (o.crest) { P.line(11, 1, 14, 0, o.crest); P.line(12, 2, 16, 0, o.crest); P.set(10, 2, o.crest); }
    }
    const L = 26 + Math.max(0, t - 1);
    if (o.weapon === 'sniper') {
      P.rect(9, 14, 5, 3, M); P.rect(13, 14, L - 11, 2, M); P.line(13, 14, L + 1, 14, M2);
      P.rect(16, 12, 5, 2, M2); P.set(20, 12, gl); P.set(L + 2, 14, gl);
    } else if (o.weapon === 'rifle') {
      P.rect(10, 14, 4, 3, M); P.rect(13, 13, L - 15, 3, M); P.line(13, 13, L - 3, 13, M2);
      P.rect(17, 16, 2, 2, M); P.set(L - 2, 14, gl);
      if (o.scope) { P.rect(15, 11, 4, 2, M2); P.set(18, 11, gl); }
      if (o.bayonet) { P.line(L - 2, 15, L + 2, 15, o.bayonet); P.set(L + 2, 15, '#ffffff'); }
    } else if (o.weapon === 'bow') {
      for (let y = 4; y <= 26; y++) {
        const x = 23 + Math.round(3 * Math.sin(Math.PI * (y - 4) / 22));
        P.set(x, y, M); P.set(x + 1, y, y % 5 === 0 ? gl : M2);
      }
      P.line(23, 4, 23, 26, gl); P.line(14, 15, 28, 15, '#c9c3b0'); P.set(29, 15, gl);

    } else if (o.weapon === 'crossbow') {

      P.line(24, 10, 26, 14, gl); P.line(24, 20, 26, 16, gl);
      P.line(12, 15, 27, 15, M2); P.set(28, 15, gl); P.rect(15, 16, 2, 2, M);
    } else if (o.weapon === 'laser') {
      P.rect(10, 12, L - 9, 5, M); P.line(10, 12, L, 12, M2);
      for (let x = 14; x < L - 2; x += 3) P.set(x, 14, gl);

  };
}

function tankMode(o) {
  return (P, f, v, t, gl) => {
    const M = o.metal, M2 = mix(M, '#ffffff', .25), T = '#2a2a22', T2 = '#5a5a44';
    P.rect(4, 12, 5, 5, o.A2);
    for (const q of [[5, 13], [7, 13], [5, 15], [7, 15]]) P.set(q[0], q[1], o.rack);
    P.rect(3, 23, 25, 7, T); P.ell(3, 26, 3, 3, T); P.ell(27, 26, 3, 3, T);
    P.line(3, 23, 27, 23, T2);
    for (let x = 5 + f * 2; x <= 26; x += 5) { P.ell(x, 26, 2, 2, T2); P.set(x, 26, T); }
    P.poly([[4, 16], [26, 16], [30, 22], [1, 22]], o.A);
    P.line(5, 16, 25, 16, o.B); P.line(3, 20, 28, 20, o.A2);
    for (let x = 6; x < 26; x += 4) P.set(x, 18, o.acc);
    P.rect(9, 10, 12, 6, o.A); P.line(10, 10, 19, 10, o.B); P.rect(11, 8, 4, 2, o.A2);
    P.rect(17, 12, 3, 2, gl); P.set(19, 12, '#ffffff');
    const L = 26 + Math.max(0, t - 1);
    P.rect(20, 12, L - 20, 2, M); P.line(20, 12, L - 1, 12, M2);
    P.rect(L - 1, 11, 2, 4, M2); P.set(L, 12, gl);
    if (t >= 3) { P.line(11, 8, 10, 3, M2); P.set(10, 2, gl); }
  };
}

function overlay(P, art, f, lk) {
  const A = ANCH[art.kind || 'human'];
  if (lk.h >= 0) {
    const c = RAR[lk.h].c, [x0, x1, y] = A.head, mid = (x0 + x1) >> 1;
    P.line(x0, y, x1, y, c);
    if (lk.h >= 2) { P.set(x0 - 1, y + 1, c); P.set(x1 + 1, y + 1, c); }
    if (lk.h >= 3) P.set(mid, y - 1, c);
    if (lk.h >= 4) { P.set(mid, y - 2, '#ffffff'); P.set(mid - 2, y - 1, c); P.set(mid + 2, y - 1, c); }
  }
  if (lk.a >= 0) {

      P.line(x, y, x + 3, y, c);

      if (lk.a >= 4) P.set(x + 1, y - 2, '#ffffff');

  }
  if (lk.b >= 0) {
    const c = RAR[lk.b].c;
    if (A.hips) {
      const [bf, ff] = stride(f);
      for (const fx of [A.hips[0] + bf, A.hips[1] + ff]) {

function spriteFor(aid, tier, look) {

  const art = HERO_ART[aid] || charOf(aid).art, glow = tier <= 0 ? art.base : RAR[tier].c;
  const n = [], w = [];
  for (let f = 0; f < 2; f++) {
    n.push([]); w.push([]);
    for (let v = 0; v < art.cloth; v++) {
      const P = Painter(32, 32);
      art.draw(P, f, v, tier, glow);

      P.outline(art.line);

}

const mkNode = (spec, id, br, x, y, req) => {

  const dist = Math.abs(x) + Math.abs(y);

function setCounts(cls) {

function bonuses() {

const S0 = {data:0, stage:0, maxStage:0, kills:0, gear:{fw:{}, sc:{}, pt:{}},

function fmtNum(n) {
  const u = [[1e15, 'qa'], [1e12, 'tri'], [1e9, 'bi'], [1e6, 'mi'], [1e3, 'mil']];
  for (const [v, s_] of u) if (n >= v) return (n / v).toLocaleString('pt-BR', {maximumFractionDigits: n / v < 10 ? 1 : 0}) + ' ' + s_;

  float(e.x + e.w / 2, GROUND - e.h - 8, fmtN(d), '#e7e3ff');
  if (e.hp > 0 && !e.boss && tv('exec') && e.hp / e.max < tv('exec')) { e.hp = 0; float(e.x + e.w / 2, GROUND - e.h - 18, 'DELETADO', '#ff8a3a'); }

function deal(e, d, area, dps) {

const CLS_SLOTS = {fw:['helmet', 'armor', 'boots', 'weapon', 'shield', 'vaccine'], sc:['helmet', 'armor', 'boots', 'weapon', 'vaccine'], pt:['helmet', 'armor', 'boots', 'weapon', 'vaccine']};

  if (s === S.maxStage) { S.maxStage++; say(`Fase ${stageLabel(s)} concluída! <span class="k">${stageLabel(s + 1)}</span> desbloqueada.`, true); }
  else say(`Fase ${stageLabel(s)} limpa.`);
  const next = S.autoAdv && s < S.maxStage ? s + 1 : s;
  startStage(next, next === s ? 'FASE LIMPA · REPETINDO' : 'FASE LIMPA → ' + stageLabel(next));
}
function rollback() {
  fails++;
  if (S.autoAdv && fails >= 2 && S.stage > 0) {
    fails = 0;
    say(`Poder insuficiente em ${stageLabel(S.stage)}. Voltando pra farmar ${stageLabel(S.stage - 1)}.`, true);
    startStage(S.stage - 1, 'RECUANDO → ' + stageLabel(S.stage - 1));
  } else {
    say(`Esquadrão derrubado em ${stageLabel(S.stage)}. Rollback da fase.`, true);
    startStage(S.stage, 'ROLLBACK');
  }
}

function update(dt) {
  t += dt;
  const alive = heroes.filter(h => !h.dead);
  if (!alive.length) { rollback(); return; }
  const front = alive.reduce((a, h) => h.def.x > a.def.x ? h : a);
  const stopX = front.def.x + front.def.w + 2;

  let slot = stopX;
  for (const e of enemies) {
    if (e.x > slot) e.x = Math.max(slot, e.x - 32 * dt);
    e.atStop = e.x <= slot + .01;
    slot = e.x + e.w + 3;
    e.flash = Math.max(0, e.flash - dt); e.lunge = Math.max(0, e.lunge - dt * 6);
  }
  const engaged = enemies.length > 0 && enemies[0].atStop;
  if (!engaged) scroll += 22 * dt;

  for (const h of heroes) {
    h.flash = Math.max(0, h.flash - dt); h.lunge = Math.max(0, h.lunge - dt * 6);
    if (h.dead) {
      h.respawn -= dt;
      if (h.respawn <= 0) { h.dead = false; h.hp = maxHp(h) * .4; }
      continue;
    }
    if (!engaged) h.hp = Math.min(maxHp(h), h.hp + maxHp(h) * .06 * dt);
    else h.hp = Math.min(maxHp(h), h.hp + maxHp(h) * ((h.def.id === 'fw' ? pT().regen || 0 : 0) + tv('regen')) * dt);
    h.t -= dt;
    if (h.t > 0) continue;
    if (h.def.id === 'pt') {
      const hurt = alive.filter(a => !a.dead && a.hp < maxHp(a) * .8).sort((a, b) => a.hp / maxHp(a) - b.hp / maxHp(b))[0];
      if (hurt) {
        const amt = atk(h) * 4;
        hurt.hp = Math.min(maxHp(hurt), hurt.hp + amt);
        burst(hurt.def.x + 15, GROUND - 16, '#6ee7a8', 6);
        float(hurt.def.x + 15, GROUND - 42, '+' + fmtN(amt), '#6ee7a8');
        h.t = cdOf(h); h.lunge = 1;
        continue;
      }
    }
    const e = enemies[0];
    if (!e || e.x > W - 6) continue;
    if (e.x - (h.def.x + h.def.w) > h.def.range) continue;
    h.t = cdOf(h); h.lunge = 1;
    if (h.def.id === 'fw') { deal(e, atk(h)); burst(e.x, GROUND - 5, '#9fd0ff', 4); }
    else if (h.def.id === 'sc') {
      const G = pG(), sh = equipped('sc').shot || {};
      const crit = Math.random() < (G.crit || 0) + tv('crit') + glob('crit'), d = atk(h) * (crit ? G.critX || 2 : 1);
      const base = {y: GROUND - (sh.y || 16), c: sh.c || heroSpr('sc').glow, style: sh.style, pierce: G.pierce || 0, splash: G.splash || 0, dps: true};
      const obs = G.obs ? ++obsCount % G.obs === 0 : false;
      shots.push({...base, x: h.def.x + (sh.x || 27), dmg: d, crit, obs});
      for (let m = 1; m <= (G.multishot || 0); m++) shots.push({...base, x: h.def.x + 27 - m * 8, y: base.y + (m % 2 ? -3 : 3), dmg: d * .5});
    }
    else shots.push({x: h.def.x + 25, y: GROUND - 28, dmg: atk(h), c: '#6ee7a8'});
  }

  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i], e = enemies[0];
    if (!e) { shots.splice(i, 1); continue; }
    s.x += (s.style === 'laser' ? 520 : 170) * dt;
    if (s.x >= e.x) {
      shots.splice(i, 1);
      if (s.crit) float(e.x + e.w / 2, GROUND - e.h - 20, 'CRIT', '#ffb454');
      const behind = s.pierce ? enemies.slice(1, s.pierce >= 1 ? undefined : 2) : [];
      const others = enemies.filter(o => o !== e);
      deal(e, s.dmg, false, s.dps);
      behind.forEach(o => { if (enemies.includes(o)) deal(o, s.dmg * (s.pierce >= 1 ? .7 : s.pierce), true, s.dps); });
      if (s.splash) {
        burst(s.x, GROUND - 8, '#ffb454', 10);
        others.forEach(o => { if (enemies.includes(o)) deal(o, s.dmg * s.splash, true, s.dps); });
      }
      if (s.dps && tv('splash') && others.length) others.forEach(o => { if (enemies.includes(o)) deal(o, s.dmg * tv('splash'), true, true); });
      if (s.dps && dpsSub() === 'area' && others.length) others.forEach(o => { if (enemies.includes(o)) deal(o, s.dmg * .3, true, true); });
      if (s.obs) {
        showBanner('ATAQUE ORBITAL', '#ff3a3a');
        enemies.slice().forEach(o => {
          for (let k = 0; k < 6; k++) parts.push({x: o.x + Math.random() * o.w, y: 0, vx: 0, vy: 140 + Math.random() * 60, life: .5, c: k % 2 ? '#ff3a3a' : '#ffb454'});
          if (enemies.includes(o)) deal(o, s.dmg * 3, true, true);
        });
      }
    }
  }

  const e = enemies[0];
  if (e && e.atStop) {
    e.t -= dt;
    if (e.t <= 0) {
      e.t = e.cd; e.lunge = 1;
      const dodged = tv('dodge') && Math.random() < tv('dodge');
      if (dodged) float(front.def.x + 15, GROUND - 40, 'BLOQUEADO', '#5ca8ff');
      const isTank = front.def.id === 'fw', dmg = e.atk * (isTank ? 1 - (pT().dmgRed || 0) : 1) * (1 - tv('red')) * (1 - gearStat(front.def.id, 'red') / 100) * (1 - wear(front.def.id, 'red'));
      if (!dodged) { front.hp -= dmg; front.flash = .1; }
      burst(front.def.x + front.def.w - 2, GROUND - 16, '#ff3d7f', 3);
      if (front.hp <= 0) { front.dead = true; front.respawn = 7; front.hp = 0; }
      if (isTank && pT().reflect) hit(e, dmg * pT().reflect);
    }
  }

  spawnT -= dt;
  if (!bossUp) {
    const st = ST();
    if (spawned < st.count) {
      if (spawnT <= 0 && enemies.length < st.max) { spawn(false); spawned++; spawnT = st.gap[0] + Math.random() * (st.gap[1] - st.gap[0]); }
    } else if (!enemies.length) {
      spawn(true); bossUp = true; showBanner('!! RANSOMWARE !!', '#ff3d7f');
    }
  }

  for (const h of heroes) {
    const vt = visTier(h.def.id);
    if (h.dead || vt < 3 || Math.random() > dt * (vt === 4 ? 14 : 7)) continue;
    parts.push({x: h.def.x + Math.random() * h.def.w, y: GROUND - Math.random() * 28, vx: 0, vy: -10 - Math.random() * 8, life: .7, c: RAR[vt].c, up: true});
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.up) { p.vy += 120 * dt; if (p.y > GROUND) { p.y = GROUND; p.vy *= -.3; p.vx *= .6; } }
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.life -= dt; f.y -= 14 * dt; if (f.life <= 0) floats.splice(i, 1); }
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

  autoT -= dt;
  if (S.autoUp && autoT <= 0) {
    autoT = .5;
    const opts = [];
    for (const [k] of SLOTS) for (const u of ['a', 'h']) opts.push([k, u, upCost(slotAid(k), u)]);
    const best = opts.sort((a, b) => a[2] - b[2])[0];
    if (best && buyUp(best[0], best[1]) && openP === 'agent') livePanel();
  }
}

// ---------- drawing ----------
const rgbaCache = {};
function rgba(hex, a) {
  const k = hex + a;
  if (!rgbaCache[k]) {
    const n = parseInt(hex.slice(1), 16);
    rgbaCache[k] = `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  }
  return rgbaCache[k];
}
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function text(str, x, y, c, center) {
  ctx.font = '8px Silkscreen, monospace';
  ctx.textBaseline = 'top';
  const w = ctx.measureText(str).width;
  const px = Math.round(center ? x - w / 2 : x), py = Math.round(y);
  ctx.fillStyle = '#000'; ctx.fillText(str, px + 1, py + 1);
  ctx.fillStyle = c; ctx.fillText(str, px, py);
}

function draw() {
  const sc = sec(), tint = sc.tint;
  ctx.fillStyle = '#0b0a16'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = rgba(tint, .12);
  const o1 = (scroll * .25) % 8;
  for (let x = -o1; x < W; x += 8) for (let y = 4; y < GROUND - 2; y += 8) ctx.fillRect(Math.round(x), y, 1, 1);
  const cw = 28, par = .5, first = Math.floor(scroll * par / cw) - 2;
  for (let c = first; c < first + W / cw + 4; c++) {
    const r = hash(c + sc.idx * 97);
    if (r < .25) continue;
    const x = Math.round(c * cw - scroll * par), y = 4 + Math.floor(r * (GROUND - 14));
    const len = 8 + Math.floor(hash(c * 7.3) * 34), dy = hash(c * 3.1) > .5 ? 6 : -6;
    ctx.fillStyle = rgba(tint, .25);
    ctx.fillRect(x, y, len, 1);
    ctx.fillRect(x + len, Math.min(y, y + dy), 1, Math.abs(dy));
    ctx.fillRect(x + len, y + dy, 10, 1);
    ctx.fillStyle = rgba(tint, .55); ctx.fillRect(x - 1, y - 1, 3, 3);
    ctx.fillStyle = '#0b0a16'; ctx.fillRect(x, y, 1, 1);
  }
  ctx.fillStyle = rgba(tint, .6); ctx.fillRect(0, GROUND, W, 1);
  ctx.fillStyle = rgba(tint, .18); ctx.fillRect(0, GROUND + 4, W, 1);
  const o2 = scroll % 6;
  for (let x = -o2; x < W; x += 6) ctx.fillRect(Math.round(x), GROUND + 1, 1, 3);
  ctx.fillStyle = rgba(tint, .9);
  for (let i = 0; i < 5; i++) ctx.fillRect(Math.round((i * 97 + t * 45) % (W + 20)) - 10, GROUND + 2, 3, 1);

  for (const h of heroes) {
    const k = h.def.id;
    const walking = !enemies[0]?.atStop && !h.dead;
    const fr = walking ? Math.floor(t * 7 + h.def.x) % 2 : 0;
    let x = h.def.x + Math.round(h.lunge * 2), y = GROUND - 31;
    if (walking && fr) y -= 1;
    if (h.dead) {
      ctx.globalAlpha = .22 + .1 * Math.sin(t * 6);
      ctx.drawImage(heroSpr(k).n[0][0], x, y);
      ctx.globalAlpha = 1;
      text(Math.ceil(h.respawn) + 's', x + 15, y - 10, '#8f89b8', true);
      continue;
    }
    const hs = heroSpr(k), frames = (h.flash > 0 ? hs.w : hs.n)[fr];
    ctx.drawImage(frames[Math.floor(t * 5 + h.def.x) % frames.length], x, y);
    if (k === 'pt') {
      ctx.fillStyle = hs.glow;
      for (let i = 0; i < 3; i++) {
        const an = t * 2 + i * 2.09;
        ctx.globalAlpha = .5 + .5 * Math.sin(an);
        ctx.fillRect(Math.round(x + 15 + Math.cos(an) * 5), Math.round(y + Math.sin(an)), 1, 1);
      }
      ctx.globalAlpha = 1;
    }
    const p = Math.max(0, h.hp / maxHp(h)), bx = x + 7;
    ctx.fillStyle = '#000'; ctx.fillRect(bx, y - 3, 16, 2);
    ctx.fillStyle = p > .35 ? '#6ee7a8' : '#ff3d7f'; ctx.fillRect(bx, y - 3, Math.ceil(16 * p), 1);
  }

  for (const e of enemies) {
    const x = Math.round(e.x - e.lunge * 2), y = GROUND - e.h;
    ctx.drawImage(e.flash > 0 ? SPRW[e.tn] : SPR[e.tn], x, y, e.w, e.h);
    const p = Math.max(0, e.hp / e.max);
    ctx.fillStyle = '#000'; ctx.fillRect(x, y - 3, e.w, 2);
    ctx.fillStyle = e.boss ? '#ffb454' : e.armored ? '#c9cfe0' : '#ff3d7f'; ctx.fillRect(x, y - 3, Math.ceil(e.w * p), 1);
    if (e.armored) { ctx.fillStyle = '#c9cfe0'; ctx.fillRect(x - 1, y - 4, 1, 4); ctx.fillRect(x + e.w, y - 4, 1, 4); }
  }

  for (const s of shots) {
    const x = Math.round(s.x);
    if (s.style === 'laser') {
      ctx.fillStyle = rgba(s.c, .35); ctx.fillRect(x - 18, s.y - 1, 20, 3);
      ctx.fillStyle = s.c; ctx.fillRect(x - 18, s.y, 20, 1);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 6, s.y, 8, 1);
    } else if (s.style === 'shell') {
      ctx.fillStyle = rgba(s.c, .4); ctx.fillRect(x - 6, s.y, 6, 1);
      ctx.fillStyle = '#2a2a22'; ctx.fillRect(x, s.y - 1, 3, 3);
      ctx.fillStyle = s.c; ctx.fillRect(x + 2, s.y, 1, 1);
    } else if (s.style === 'arrow') {
      ctx.fillStyle = '#c9c3b0'; ctx.fillRect(x - 7, s.y, 7, 1);
      ctx.fillStyle = s.c; ctx.fillRect(x, s.y - 1, 1, 3); ctx.fillRect(x + 1, s.y, 1, 1);
      ctx.fillRect(x - 8, s.y - 1, 1, 1); ctx.fillRect(x - 8, s.y + 1, 1, 1);
    } else {
      ctx.fillStyle = rgba(s.c, .35); ctx.fillRect(x - 5, s.y, 5, 1);
      ctx.fillStyle = s.c; ctx.fillRect(x, s.y, 3, 1);
    }
  }
  for (const p of parts) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); text(f.txt, f.x, f.y, f.c, true); }
  ctx.globalAlpha = 1;
  if (banner) {
    ctx.globalAlpha = Math.min(1, banner.life * 2);
    text(banner.text, W / 2, 3, banner.color, true);
    ctx.globalAlpha = 1;
  }
}

const stars = n => '★'.repeat(n);
const dupVal = st => rewardAt(S.maxStage * 10 + 5) * {3:15, 4:60, 5:250}[st];
let gBanner = 'fw', lastPull = null;
const pityOf = (cls, chip) => S.pity[cls][chip] || (S.pity[cls][chip] = {p5:0, p4:0});
function pullOne(cls, chip, minStars) {
  const C = CHIPS[chip], P = pityOf(cls, chip), r = Math.random();
  P.p5++; P.p4++;
  let st = C.pity5 && P.p5 >= C.pity5 ? 5 : r < C.p5 ? 5 : C.pity4 && P.p4 >= C.pity4 ? 4 : r < C.p5 + C.p4 ? 4 : 3;
  st = Math.max(st, minStars, C.min || 3);
  if (st === 5) { P.p5 = 0; P.p4 = 0; }
  if (st === 4) P.p4 = 0;
  const pool = CLASSES[cls].list.filter(x => x.stars === st), T = pool[Math.random() * pool.length | 0];
  if (!(T.id in S.roster)) { S.roster[T.id] = 1; return {T, res:'new'}; }
  const v = dupVal(st); S.data += v;
  return {T, res:'dup', v};
}
function summon(chip, n) {
  const st = S.inv.find(x => x.k === 'chip' && x.r === chip);
  if (!st || st.n < n) return;
  st.n -= n; if (!st.n) S.inv.splice(S.inv.indexOf(st), 1);
  const out = [];
  for (let i = 0; i < n; i++) {
    const needFour = CHIPS[chip].ten4 && n === 10 && i === n - 1 && !out.some(o => o.T.stars >= 4);
    out.push(pullOne(gBanner, chip, needFour ? 4 : 3));
  }
  lastPull = {cls: gBanner, out};
  const best = out.reduce((a, o) => o.T.stars > a.T.stars ? o : a);
  const dup = out.filter(o => o.res === 'dup').reduce((a, o) => a + o.v, 0);
  if (best.T.stars === 5) { showBanner('★★★★★ ' + best.T.name, '#ffb454'); say(`<span style="color:#ffb454">★5 ${best.T.name}</span> baixado!`, true); }
  else say(`Download ×${n}: melhor ${stars(best.T.stars)} ${best.T.name}`);
  if (dup) say(`Repetidos convertidos → +${fmt(dup)}`);
  renderPanel(); save();
}
function equip(id) {
  if (!(id in S.roster)) return;
  const cls = clsOf(id);
  S[CLASSES[cls].key] = id; applySlots();
  const h = heroOf(cls);
  if (!h.dead) h.hp = maxHp(h);
  say(`${cls === 'sc' ? 'DPS' : 'Tanque'} ativo: ${charOf(id).name}`, true);
  renderPanel(); save();
}

tipEl.className = 'tip'; tipEl.hidden = true; document.body.appendChild(tipEl);
function placeTip(ev) {

  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;

}
document.addEventListener('mouseover', ev => {

const UIICON = {};
function uiIcon(k) {
  if (UIICON[k]) return UIICON[k];
  const P = Painter(16, 16), A = '#ffb454', C = '#5ce1e6', M = '#9aa1bd', D = '#3a3f5c';
  if (k === 'agent') { P.ell(8, 5, 3, 3, M); P.rect(6, 4, 5, 2, C); P.poly([[2, 15], [4, 10], [8, 9], [12, 10], [14, 15]], D); P.line(6, 11, 10, 11, A); }
  else if (k === 'col') { P.rect(1, 5, 7, 10, D); P.rect(4, 3, 7, 10, M); P.rect(8, 1, 7, 10, '#c38cff'); P.rect(10, 4, 3, 3, '#ffffff'); }
  else if (k === 'comp') { P.poly([[8, 1], [15, 5], [8, 9], [1, 5]], A); P.poly([[1, 5], [8, 9], [8, 15], [1, 11]], mix(A, '#000000', .35)); P.poly([[15, 5], [8, 9], [8, 15], [15, 11]], mix(A, '#000000', .55)); }
  else if (k === 'gacha') { P.rect(6, 1, 4, 7, C); P.poly([[2, 7], [14, 7], [8, 13]], C); P.rect(1, 14, 14, 2, M); }
  else if (k === 'tree') { P.poly([[2, 1], [14, 1], [14, 8], [8, 15], [2, 8]], '#5ca8ff'); P.line(5, 7, 7, 10, '#ffffff'); P.line(7, 10, 11, 4, '#ffffff'); }
  else if (k === 'stages') { P.line(4, 1, 4, 15, M); P.poly([[5, 1], [14, 4], [5, 8]], '#ff3d7f'); P.rect(1, 14, 7, 2, D); }
  else if (k === 'coin') { P.ell(8, 8, 6, 6, '#b8741a'); P.ell(8, 8, 5, 5, '#ffb454'); P.rect(7, 4, 2, 8, '#b8741a'); P.line(5, 6, 10, 6, '#b8741a'); P.line(5, 10, 10, 10, '#b8741a'); }
  else if (k === 'defs') { P.rect(3, 1, 10, 14, '#1f5a60'); for (let y = 3; y < 14; y += 3) P.line(5, y, 11, y, '#5ce1e6'); P.set(11, 3, '#ffffff'); }

}

  log: () => `<ol class="log">${LOG.map(l => `<li class="${l.hl ? 'hl' : ''}"><time>${l.time}</time>${l.txt}</li>`).join('') || '<li>Nada ainda.</li>'}</ol>`,

  readme: () => `<p><b>Você não é um herói de fantasia. Você é o antivírus.</b></p>
    <p>Um esquadrão de agentes digitais (tanque, DPS e suporte) patrulha o seu computador enquanto você trabalha, caçando vírus de fase em fase. Cada vírus apagado vira <span class="k">créditos</span>, o dinheiro do jogo.</p>
    <p><b>Antivírus:</b> a árvore de atualizações do sistema, paga com DEF. <b>Fases:</b> Horda (muitos vírus juntos, bom pra DPS de Área), Blindados (poucos e resistentes, bom pra Precisão) e Chefão (bom pra Caça-chefes).</p>
    <p><b>Esquadrão:</b> gaste créditos pra aprimorar dano e resistência de cada personagem. <b>Inventário:</b> equipamentos (capacete, armadura, botas, arma e, no tanque, escudo) com tiers T1 a T5, e pacotes de download. Os itens equipados aparecem no personagem. <b>Download:</b> use pacotes Comum, Raro ou Lendário pra baixar novos tanques e DPS; repetidos viram créditos. A <b>Coleção</b> fica no Esquadrão. <b>Fases:</b> escolha onde farmar; as mais altas pedem mais poder.</p>
    <p class="opts"><button type="button" id="wipe">Apagar progresso</button></p>`,
};
function renderPanel() {
  if (!openP) return;
  $('#pTitle').textContent = PANELS[openP];
  $('#panel').classList.toggle('wide', openP === 'tree');
  const body = $('#pBody'), top = body.scrollTop;
  tipEl.hidden = true;
  body.innerHTML = RENDER[openP]();
  body.scrollTop = top;
  const map = $('#tmap');
  if (map) {
    const can = map.firstElementChild;
    if (tScroll) { map.scrollLeft = tScroll[0]; map.scrollTop = tScroll[1]; }
    else { map.scrollLeft = (can.offsetWidth - map.clientWidth) / 2; map.scrollTop = (can.offsetHeight - map.clientHeight) / 2; }
    map.addEventListener('scroll', () => { tScroll = [map.scrollLeft, map.scrollTop]; });
    // arrastar pra navegar; clique curto seleciona o nó
    let drag = null;
    map.addEventListener('pointerdown', ev => { drag = {x:ev.clientX, y:ev.clientY, l:map.scrollLeft, t:map.scrollTop, moved:false}; });
    map.addEventListener('pointermove', ev => {
      if (!drag) return;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
      if (drag.moved) { map.scrollLeft = drag.l - dx; map.scrollTop = drag.t - dy; map.classList.add('dragging'); }
    });
    const end = () => { setTimeout(() => { drag = null; }, 0); map.classList.remove('dragging'); };
    map.addEventListener('pointerup', end); map.addEventListener('pointerleave', end);
    map.addEventListener('click', ev => {
      const n = ev.target.closest('[data-tn]');
      if (!n || (drag && drag.moved)) return;
      tSel = n.dataset.tn;
      const node = TREE.find(x => x.id === tSel);
      if (node && node.br >= 0 && nodeOpen(node) && nodeLv(node.id) < node.max && S.def >= nodeCost(node)) { buyNode(node.id); return; }
      map.querySelectorAll('.tn.sel').forEach(x => x.classList.remove('sel')); n.classList.add('sel');
      $('#tdet').innerHTML = treeDetail();
    });
  }
  livePanel();
}
function livePanel() {
  $('#pCur').innerHTML = `<img src="${uiIcon('coin')}" width="12" height="12" alt=""> <b>${fmtNum(S.data)}</b> créditos · <img src="${uiIcon('defs')}" width="12" height="12" alt=""> <i>${fmtNum(S.def)}</i> definições`;
  $('#pStatus').innerHTML = `<span class="ok">● PROTEÇÃO ATIVA</span><span>fase ${stageLabel(S.stage)} · ${ST().n}</span><span>${S.inv.length}/${invCap()} itens</span><span>poder ${fmtN(power())}</span><span>créditos: ${fmtNum(S.data)}</span><span>definições: ${fmtNum(S.def)}</span>`;
  if (openP === 'agent') for (const [k] of SLOTS) {
    const h = heroOf(k), aid = slotAid(k), lv = lvOf(aid), el = $('#hp-' + k);
    if (!el) continue;
    const p = h.dead ? 0 : h.hp / maxHp(h) * 100;
    el.style.width = p.toFixed(1) + '%'; el.style.background = p < 35 ? 'var(--pink)' : '';
    $('#st-' + k).innerHTML = [['dano', fmtN(atk(h))], ['vida', `${fmtN(h.hp)}/${fmtN(maxHp(h))}`], ['ataques/s', (1 / cdOf(h)).toFixed(2)], ['nível', lv.a + lv.h]]
      .map(([a, v]) => `<div><span>&gt; ${a}</span><i></i><b>${v}</b></div>`).join('');
    for (const u of ['a', 'h']) {
      const b = $(`#u${u}-${k}`), c = upCost(aid, u);
      b.innerHTML = `&gt; ${u === 'a' ? 'overclock <small>(+dano)</small>' : 'blindagem <small>(+vida)</small>'} nv${lv[u]} <b><img src="${uiIcon('coin')}" width="10" height="10" alt=""> ${fmtNum(c)}</b>`;
      b.disabled = S.data < c;
    }
  }
}
function openPanel(k, force) {
  openP = !force && openP === k ? null : k;
  $('#panel').hidden = !openP;
  document.querySelectorAll('.tabs [data-open], #pNav [data-open]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.open === openP)));
  if (openP) renderPanel();
}
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) { openPanel(o.dataset.open, !!o.closest('#pNav')); return; }
});
$('#pClose').addEventListener('click', () => openPanel(null, true));
$('#pNav').innerHTML = NAV.map(([k, n]) => `<button type="button" class="nb" data-open="${k}" aria-pressed="false" title="${n}"><img src="${uiIcon(k)}" width="20" height="20" alt=""><span>${n}</span></button>`).join('');
$('#pLogo').src = treeIcon('core');
$('#icCoin').src = uiIcon('coin');
document.querySelectorAll('.tabs [data-open]').forEach(b => { const k = b.dataset.open, n = NAV.find(x => x[0] === k); if (n) b.insertAdjacentHTML('afterbegin', `<img src="${uiIcon(k)}" width="16" height="16" alt="">`); });
let wipeArmed = 0;
$('#pBody').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.up) { const [k, u] = d.up.split(':'); if (buyUp(k, u)) livePanel(); }
  else if (d.uneq) { const [c, ty] = d.uneq.split(':'); unequip(c, ty); }
  else if (d.swap) { colCls = d.swap; openPanel('col', true); }
  else if (d.ag) { agSel = d.ag; renderPanel(); }
  else if (d.agstep) { const ks = SLOTS.map(x => x[0]); agSel = ks[(ks.indexOf(agSel) + +d.agstep + ks.length) % ks.length]; renderPanel(); }
  else if (d.colc) { colCls = d.colc; renderPanel(); }
  else if (d.gocol !== undefined) { colCls = gBanner; openPanel('col', true); }
  else if (d.prev !== undefined) { const v = +d.prev; previewTier = v < 0 ? null : v; renderPanel(); }
  else if (d.cell !== undefined) { selInv = +d.cell; renderPanel(); }
  else if (d.invtab) { invTab = d.invtab; renderPanel(); }
  else if (d.csel !== undefined) { const i = +d.csel; cSel = cSel.includes(i) ? cSel.filter(x => x !== i) : cSel.length < COMP_N ? [...cSel, i] : cSel; renderPanel(); }
  else if (d.cauto !== undefined) { const sel = autoPick(compAll); if (sel) cSel = sel; else say('Não há 5 itens do mesmo tier pra compilar.'); renderPanel(); }
  else if (d.cgo !== undefined) { if (compile(cSel)) { renderPanel(); save(); } }
  else if (d.cclear !== undefined) { cSel = []; renderPanel(); }
  else if (d.equip !== undefined) equipItem(+d.equip);
  else if (d.sell !== undefined) sellItem(+d.sell);
  else if (d.sellworse !== undefined) sellWorse();
  else if (d.go) { gBanner = d.go; openPanel('gacha', true); }
  else if (d.ban) { gBanner = d.ban; renderPanel(); }
  else if (d.pull) { const [r, n] = d.pull.split(':').map(Number); summon(r, n); }
  else if (d.eq) equip(d.eq);
  else if (d.node) buyNode(d.node);
  else if (d.freedef !== undefined) { S.def += 500; renderPanel(); }
  else if (d.stage !== undefined) { fails = 0; startStage(+d.stage); say(`Farmando ${stageLabel(+d.stage)}`); }
  else if (d.free !== undefined) { addItem({k:'chip', r:0, n:10}); addItem({k:'chip', r:1, n:3}); addItem({k:'chip', r:2, n:1}); renderPanel(); save(); }
  else if (b.id === 'wipe') {
    if (Date.now() - wipeArmed > 3000) { wipeArmed = Date.now(); b.textContent = 'Clique de novo pra confirmar'; return; }
    S = structuredClone(S0); applySlots(); resetHeroes(); lastPull = null; selInv = -1;
    startStage(0); say('Progresso apagado.', true); renderPanel();
  }
});
$('#pBody').addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'oUp') S.autoUp = e.target.checked;
  if (id === 'oEq') S.autoEq = e.target.checked;
  if (id === 'oComp') S.autoComp = e.target.checked;
  if (id === 'oCompAll') { compAll = e.target.checked; return; }
  if (id === 'oAdv') S.autoAdv = e.target.checked;
  save();
});
$('#speed').addEventListener('click', e => {
  speed = speed === 1 ? 3 : speed === 3 ? 10 : 1;
  e.target.textContent = speed + '×';
});

function renderHud() {
  bonusCache = null;
  const s = sec();
  document.querySelector('.dock').style.setProperty('--sec', s.tint);
  $('#stgBtn').textContent = stageLabel(S.stage) + ' ' + s.name + ' · ' + ST().n.toUpperCase();
  $('#secBar').style.width = (bossUp ? 100 : S.kills / ST().count * 100) + '%';
  $('#secTxt').textContent = bossUp ? 'BOSS' : S.kills + '/' + ST().count;
  $('#def').textContent = fmtN(S.def);
  $('#data').textContent = fmtNum(S.data);
  $('#pow').textContent = fmtN(power());
  $('#invN').textContent = S.inv.length + '/' + invCap();
}
function clock() { const d = new Date(); $('#clock').textContent = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }

function offline(ms) {
  const sec_ = Math.min(ms / 1000, 8 * 3600);
  if (sec_ < 30) return;
  const gain = sec_ * rewardAt(S.stage * 10 + 5) * .25 * (1 + tv('off'));
  S.data += gain;
  let chips = 0;
  for (let c = 0; c < Math.floor(sec_ / 120); c++)
    for (let r = CHIPS.length - 1; r >= 0; r--) if (Math.random() < chipChance(r, false) * (1 + tv('off'))) { addItem({k:'chip', r, n:1}); chips++; break; }
  const h = Math.floor(sec_ / 3600), m = Math.floor(sec_ % 3600 / 60);
  say(`Enquanto você estava fora (${h ? h + 'h ' : ''}${m}min): +${fmt(gain)}${chips ? ` e ${chips} pacote(s) de download` : ''}`, true);
  showBanner('+' + fmt(gain) + ' OFFLINE', '#ffb454');
}

function resize() {
  const w = cv.parentElement.clientWidth;
  W = Math.max(160, Math.floor(w / SCALE));
  cv.width = W; cv.height = H;
  cv.style.width = W * SCALE + 'px'; cv.style.height = H * SCALE + 'px';
  ctx.imageSmoothingEnabled = false;
}
new ResizeObserver(resize).observe(cv.parentElement);
resize();

say('daemon.exe iniciado.', true);
if (S.last) offline(Date.now() - S.last);
startStage(S.stage);
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); }
  else if (hiddenAt) { offline(Date.now() - hiddenAt); hiddenAt = 0; }
});
setInterval(save, 5000);
setInterval(() => { renderHud(); livePanel(); }, 250);
setInterval(clock, 10000); clock();
renderHud();

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  for (let i = 0; i < speed; i++) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
